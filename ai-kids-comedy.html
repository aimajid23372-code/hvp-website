  <style>
    :root {
      --bg-base: #040711;
      --bg-surface: #0b1121;
      --bg-card: rgba(13, 19, 36, 0.78);
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-glow: rgba(0, 229, 255, 0.35);
      --accent-primary: #00E5FF;
      --accent-blue: #3B82F6;
      --accent-purple: #A855F7;
      --accent-magenta: #E879F9;
      --accent-gold: #F59E0B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --font-display: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Noto Sans Bengali', 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-display {
      font-family: var(--font-display);
      letter-spacing: -0.01em;
    }

    .font-mono-num {
      font-family: var(--font-mono);
    }

    /* Ambient Luxury Backdrop */
    .hvb-ambient-bg {
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent-primary) 13%, transparent), transparent 36%),
        radial-gradient(circle at 88% 12%, color-mix(in srgb, var(--accent-purple) 14%, transparent), transparent 38%),
        radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--accent-blue) 8%, transparent), transparent 50%),
        linear-gradient(rgba(148, 163, 184, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    }

    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s ease, box-shadow 0.28s ease;
    }

    .glass-card-hover:hover {
      transform: translateY(-4px);
      border-color: var(--border-glow);
      box-shadow: 0 22px 48px -18px rgba(0, 229, 255, 0.22), 0 0 0 1px rgba(168, 85, 247, 0.16);
    }

    .gradient-text {
      background: linear-gradient(100deg, var(--accent-primary) 0%, var(--accent-blue) 36%, var(--accent-purple) 70%, var(--accent-magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-cyber {
      background: linear-gradient(100deg, var(--accent-primary) 0%, var(--accent-blue) 45%, var(--accent-purple) 100%);
      color: #030712;
      font-weight: 700;
      box-shadow: 0 10px 28px -8px color-mix(in srgb, var(--accent-primary) 55%, transparent);
      transition: all 0.22s ease;
    }
    .btn-cyber:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 14px 34px -8px color-mix(in srgb, var(--accent-purple) 60%, transparent);
    }

    .btn-outline-glass {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      transition: all 0.22s ease;
    }
    .btn-outline-glass:hover {
      border-color: var(--accent-primary);
      background: rgba(0, 229, 255, 0.08);
    }

    .logo-ring {
      background: conic-gradient(from 140deg, var(--accent-primary), var(--accent-blue), var(--accent-purple), var(--accent-magenta), var(--accent-primary));
      padding: 2.5px;
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent-primary) 38%, transparent);
    }

    /* Light Mode Override (Arctic Clean Light Template) */
    body.theme-light {
      --bg-base: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-card: rgba(255, 255, 255, 0.92);
      --border-subtle: rgba(15, 23, 42, 0.10);
      --border-glow: rgba(37, 99, 235, 0.35);
      --text-main: #0F172A;
      --text-muted: #475569;
    }
    body.theme-light .btn-cyber { color: #FFFFFF; }
    body.theme-light .btn-outline-glass { background: rgba(15, 23, 42, 0.04); color: #0F172A; }
    body.theme-light .text-slate-300 { color: #334155 !important; }
    body.theme-light .text-slate-400 { color: #475569 !important; }
    body.theme-light .text-white { color: #0F172A !important; }
    body.theme-light .bg-slate-900\/80,
    body.theme-light .bg-slate-900\/90,
    body.theme-light .bg-slate-950\/80 { background-color: rgba(255,255,255,0.92) !important; }
    body.theme-light .bg-white\/5 { background-color: rgba(15,23,42,0.04) !important; }
    body.theme-light .border-white\/10 { border-color: rgba(15,23,42,0.10) !important; }
    body.theme-light .keep-white { color: #FFFFFF !important; }

    /* Custom Range Slider */
    input[type="range"].hvb-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-purple), var(--accent-magenta));
      outline: none;
    }
    input[type="range"].hvb-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--accent-primary);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
    }

    /* Subtle scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    .animate-pulse-glow { animation: pulseGlow 2.8s ease-in-out infinite; }
  </style>
</head>

      function esc(str) {

          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function toBnDigits(val) {
        const map = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
        return String(val).replace(/[0-9]/g, d => map[d]);
      }

      function formatTaka(num) {
        const n = Number(num) || 0;
        return toBnDigits(n.toLocaleString('en-US')) + ' ৳';
      }

      function cleanReviewerName(raw) {
        let s = String(raw || '').trim();
        s = s.replace(/(ai-kids-comedy|bundle|short|long)$/i, '').trim();
        s = s.replace(/^([A-Za-z])\1(?=[A-Za-z])/i, '$1');
        s = s.replace(/^9999/i, '').replace(/999/g, '').trim();
        return s.replace(/\s+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Verified Student';
      }

      function showToast(msg, type) {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        const colors = type === 'error'
          ? 'bg-rose-950/95 border-rose-500/50 text-rose-100'
          : 'bg-slate-900/95 border-cyan-400/50 text-cyan-100';
        el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-2xl text-sm font-medium flex items-center gap-2.5 backdrop-blur-md transition-all duration-300 ${colors}`;
        el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${esc(msg)}</span>`;
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(8px)';
          setTimeout(() => el.remove(), 260);
        }, 3000);
      }

      function copyText(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast(`${label || 'কপি করা হয়েছে'}: ${text}`)).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
        showToast(`${label || 'কপি করা হয়েছে'}: ${text}`);
      }

        s = s.replace(/\.html$/i, '');
        if (s === '/index') s = '/';
        const valid = ['/', '/admin', ...state.courses.map(c => c.route)];
        return valid.includes(s) ? s : '/';
      }

      function openCheckoutModal(courseId) {
        const course = getCourseById(courseId);
        let appliedCoupon = null;
        const modal = document.getElementById('modal-root');

        function renderCheckoutInner() {
          let discount = 0;
          if (appliedCoupon) {
            discount = appliedCoupon.type === 'percent'
              ? Math.round(course.price * (appliedCoupon.value / 100))
              : appliedCoupon.value;
          }
          const finalPrice = Math.max(0, course.price - discount);

          modal.innerHTML = `
            <div class="glass-card rounded-3xl max-w-lg w-full p-6 sm:p-7 border border-cyan-400/35 shadow-2xl space-y-5 relative max-h-[90vh] overflow-y-auto">
              <button type="button" id="close-modal-btn" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center">✕</button>
              <div class="flex items-center gap-3.5">
                <img src="${course.banner}" alt="${esc(course.bnTitle)}" class="w-16 h-12 rounded-xl object-cover border border-white/15 shrink-0" />
                <div>
                  <div class="text-xs text-cyan-300 font-semibold">⚡ Auto Delivery · ৬ মাস অ্যাকসেস</div>
                  <h3 class="font-display font-bold text-lg text-white">${esc(course.bnTitle)}</h3>
                </div>
              </div>

              <form id="checkout-form" class="space-y-3.5 text-sm">
                <div>
                  <label class="block text-xs text-slate-300 mb-1">আপনার পূর্ণ নাম *</label>
                  <input id="co-name" type="text" required placeholder="যেমন: রায়হান আহমেদ" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/15 text-white" />
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-slate-300 mb-1">মোবাইল নাম্বার (WhatsApp) *</label>
                    <input id="co-phone" type="tel" required placeholder="01XXXXXXXXX" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/15 text-white font-mono-num" />
                  </div>
                  <div>
                    <label class="block text-xs text-slate-300 mb-1">ইমেইল *</label>
                    <input id="co-email" type="email" required placeholder="you@gmail.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/15 text-white" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs text-slate-300 mb-1">পেমেন্ট মাধ্যম</label>
                  <select id="co-method" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-white/15 text-white">
                    <option value="bKash">bKash (বিকাশ)</option>
                    <option value="Nagad">Nagad (নগদ)</option>
                    <option value="Rocket">Rocket (রকেট)</option>
                  </select>
                </div>

                <!-- Coupon Row -->
                <div class="flex gap-2">
                  <input id="co-coupon-input" type="text" value="${appliedCoupon ? esc(appliedCoupon.code) : ''}" placeholder="কুপন কোড (HVB50 / SHORT445)" class="flex-1 px-3.5 py-2 rounded-xl bg-slate-950 border border-white/15 text-white font-mono-num uppercase text-xs" />
                  <button type="button" id="co-apply-coupon" class="px-4 py-2 rounded-xl btn-outline-glass text-xs font-bold">অ্যাপ্লাই</button>
                </div>

                <div class="rounded-2xl bg-white/5 border border-white/10 p-4 space-y-1.5 text-xs">
                  <div class="flex justify-between text-slate-300"><span>কোর্স ফি</span><span class="font-mono-num">${formatTaka(course.price)}</span></div>
                  ${discount > 0 ? `<div class="flex justify-between text-emerald-300"><span>কুপন ছাড় (${esc(appliedCoupon.code)})</span><span class="font-mono-num">− ${formatTaka(discount)}</span></div>` : ''}
                  <div class="flex justify-between text-white font-bold text-base pt-2 border-t border-white/10"><span>সর্বমোট</span><span class="font-mono-num text-cyan-300">${formatTaka(finalPrice)}</span></div>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl btn-cyber text-base">পেমেন্ট সম্পন্ন করুন (${formatTaka(finalPrice)}) →</button>
              </form>
            </div>`;

          document.getElementById('close-modal-btn').addEventListener('click', closeModal);
          document.getElementById('co-apply-coupon').addEventListener('click', () => {
            const code = (document.getElementById('co-coupon-input').value || '').trim().toUpperCase();
            const found = state.coupons.find(c => c.active && c.code.toUpperCase() === code);
            if (found) {
              appliedCoupon = found;
              showToast(`কুপন ${found.code} অ্যাপ্লাই হয়েছে!`);
              renderCheckoutInner();
            } else {
              showToast('সঠিক কুপন কোড নয় (HVB50 বা SHORT445 ব্যবহার করুন)', 'error');
            }
          });
          document.getElementById('checkout-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const name = document.getElementById('co-name').value.trim();
            const phone = document.getElementById('co-phone').value.trim();
            const email = document.getElementById('co-email').value.trim();
            const method = document.getElementById('co-method').value;

            const newOrder = {
              id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
              name, phone, email,
              course: course.id,
              amount: finalPrice,
              method,
              trxId: 'AUTO' + Math.floor(10000 + Math.random() * 90000),
              status: 'paid',
              date: new Date().toISOString().slice(0, 10)
            };

            if (isProductionDomain()) {
              try {
                const res = await fetch(window.location.origin + '/api/' + 'create-invoice', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ name, phone, email, course: course.id, amount: finalPrice, coupon: appliedCoupon ? appliedCoupon.code : '' })
                });
                const data = await res.json();
                if (data && data.payment_url) {
                  window.location.href = data.payment_url;
                  return;
                }
              } catch (err) {
                // Fallback gracefully to confirmation UI
              }
            }

            state.orders.unshift(newOrder);
            saveState();
            closeModal();
            showToast(`অভিনন্দন ${name}! আপনার ${course.bnTitle} অ্যাকসেস চালু হয়েছে।`);
          });
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderCheckoutInner();
      }

          }
        } else if (previewBar) {
          document.querySelectorAll('.preview-chip').forEach(btn => {
            btn.addEventListener('click', () => navigate(btn.getAttribute('data-preview-route')));
          });
          const form = document.getElementById('preview-url-form');
          if (form) {
            form.addEventListener('submit', (ev) => {
              ev.preventDefault();
              navigate(document.getElementById('preview-url-input').value);
            });
          }
        }

        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
          if (remainingSeconds > 0) remainingSeconds--;
          const el = document.getElementById('hvb-countdown');
          if (el) {
            const hrs = String(Math.floor(remainingSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((remainingSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(remainingSeconds % 60).padStart(2, '0');
            el.textContent = `⏱ ${hrs}:${mins}:${secs}`;
          }
        }, 1000);

        updatePreviewBarHighlight();
        renderApp();
      }

      boot();
    })();
  </script>
</body>
</html>
