<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Dashboard | HVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070A11; --surface:rgba(20,26,40,0.72); --surface-2:rgba(30,38,58,0.7); --line:rgba(255,255,255,0.08);
    --line-2:rgba(255,255,255,0.14);
    --text:#EDF2FF; --muted:#94A0BA; --mint:#B4F0F0; --cyan:#3FC7F2; --violet:#7C6BF5;
    --grad: linear-gradient(100deg, var(--mint), var(--cyan) 45%, var(--violet));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 10% -5%, rgba(63,199,242,0.10), transparent 60%),
      radial-gradient(700px 500px at 95% 5%, rgba(124,107,245,0.12), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'Hind Siliguri', sans-serif; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  header{
    position:sticky; top:0; z-index:20; background:rgba(7,10,17,0.72); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:34px; height:34px; border-radius:9px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:'Sora',sans-serif; font-size:1.02em; letter-spacing:-.01em; }
  .brand-text span{ font-size:0.64em; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .back-link{ color:var(--muted); font-size:0.9em; transition:color .2s; }
  .back-link:hover{ color:var(--mint); }
  .wrap{ max-width:820px; margin:0 auto; padding:44px 22px 100px; }
  h1{ font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(1.6em,5vw,2.2em); letter-spacing:-.02em; margin-bottom:8px; }
  h1 .dot{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.lead{ color:var(--muted); margin-bottom:26px; }

  .card{
    position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:22px; margin-bottom:16px; backdrop-filter:blur(16px);
    box-shadow:0 18px 40px -28px rgba(0,0,0,.9);
  }
  .card h3{
    font-family:'Sora',sans-serif; font-size:0.96em; font-weight:600; letter-spacing:.01em;
    margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .card h3 .ttl{ display:flex; align-items:center; gap:9px; }
  .ico{
    width:30px; height:30px; flex:none; border-radius:9px; display:grid; place-items:center; font-size:.9em;
    background:linear-gradient(140deg, rgba(63,199,242,.18), rgba(124,107,245,.2));
    border:1px solid var(--line-2);
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.82em; color:var(--muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:13px 15px; background:rgba(10,14,23,.7); border:1px solid var(--line-2);
    border-radius:12px; color:var(--text); font-size:0.95em; font-family:'Hind Siliguri'; transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(63,199,242,.15); }
  .btn{
    width:100%; background:var(--grad); color:#061019; border:none; padding:14px;
    font-weight:700; border-radius:12px; cursor:pointer; font-size:0.96em; font-family:inherit;
    transition:transform .15s, filter .2s; box-shadow:0 12px 26px -16px rgba(63,199,242,.9);
  }
  .btn:hover{ transform:translateY(-1px); filter:brightness(1.05); }
  .btn[disabled]{ opacity:.55; cursor:default; transform:none; }
  .btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--line-2); box-shadow:none; }
  .btn-ghost:hover{ border-color:var(--cyan); }
  .btn-sm{ width:auto; padding:8px 15px; font-size:0.8em; border-radius:10px; }
  .msg{ font-size:0.88em; margin-top:10px; min-height:1.2em; }
  .msg.error{ color:#FFC46B; }
  .msg.success{ color:var(--mint); }

  .hero{
    background:linear-gradient(150deg, rgba(63,199,242,.14), rgba(124,107,245,.14) 70%, transparent);
    border:1px solid var(--line-2);
  }
  .who{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .avatar{
    width:44px; height:44px; border-radius:14px; flex:none; display:grid; place-items:center;
    font-family:'Sora',sans-serif; font-weight:700; color:#061019; background:var(--grad); font-size:1.05em;
  }
  .who .nm{ font-family:'Sora',sans-serif; font-weight:600; font-size:1.05em; line-height:1.25; }
  .who .rf{ font-size:.8em; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .dash-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
  .dash-box{ background:rgba(10,14,23,.55); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; }
  .dash-box .num{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.18em; color:var(--mint); }
  .dash-box .lbl{ color:var(--muted); font-size:0.74em; margin-top:2px; line-height:1.35; }
  .dash-pending{
    background:linear-gradient(120deg, rgba(180,240,240,.16), rgba(124,107,245,.18));
    border:1px solid rgba(63,199,242,.5); border-radius:16px; padding:20px; text-align:center;
  }
  .dash-pending .num{ font-family:'Sora',sans-serif; font-weight:800; font-size:2em; letter-spacing:-.02em;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .dash-pending .lbl{ color:var(--muted); font-size:0.84em; }
  .note{ color:var(--muted); font-size:0.84em; margin-top:8px; }

  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); font-size:0.92em; }
  .row:last-child{ border-bottom:none; }
  .row small{ display:block; color:var(--muted); font-size:.82em; }
  .row b{ color:var(--mint); white-space:nowrap; font-family:'Sora',sans-serif; }
  .row b.out{ color:var(--violet); }

  .link-box{
    display:flex; align-items:center; gap:10px; word-break:break-all;
    background:rgba(10,14,23,.6); border:1px solid rgba(63,199,242,.4); border-radius:12px;
    padding:14px 16px; font-weight:600; color:var(--mint); font-family:'JetBrains Mono',monospace; font-size:.9em;
  }
  .pay-line{ display:flex; align-items:center; gap:12px; background:rgba(10,14,23,.6); border:1px solid var(--line-2);
    border-radius:12px; padding:13px 15px; }
  .pay-line .pm{ font-weight:700; color:var(--cyan); font-family:'Sora',sans-serif; font-size:.9em; }
  .pay-line .pn{ font-family:'JetBrains Mono',monospace; letter-spacing:.03em; }
  .badge{ font-size:.72em; padding:4px 10px; border-radius:999px; border:1px solid var(--line-2); color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .chip{ font-size:.72em; padding:4px 11px; border-radius:999px; font-weight:700; white-space:nowrap; }
  .chip.paid{ background:rgba(180,240,240,.14); color:var(--mint); border:1px solid rgba(180,240,240,.35); }
  .chip.pending{ background:rgba(255,196,107,.12); color:#FFC46B; border:1px solid rgba(255,196,107,.3); }
  .chip.rejected{ background:rgba(148,160,186,.12); color:var(--muted); border:1px solid var(--line-2); }
  .empty{ color:var(--muted); font-size:.88em; text-align:center; padding:12px 0; }
  .hide{ display:none !important; }
  .split{ display:flex; gap:10px; }
  .split > *{ flex:1; }
  .sum{ display:flex; gap:10px; margin-bottom:14px; }
  .sum > div{ flex:1; background:rgba(10,14,23,.55); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  .sum .k{ color:var(--muted); font-size:.76em; }
  .sum .v{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.02em; }
  @media (max-width:640px){
    .wrap{ padding:28px 15px 80px; }
    .dash-grid{ grid-template-columns:repeat(2,1fr); }
    .card{ padding:18px; border-radius:16px; }
  }
</style>

<body>
<script src="hvb-ref.js"></script>
<script src="/hvb-track.js?v=20260917-1"></script>

<header>
  <a href="/" class="brand">
    <img src="hvb-logo.png" alt="HVB Logo">
    <div class="brand-text"><b>HVB</b><span>Hyper Vision Bangla</span></div>
  </a>
  <a href="/" class="back-link">← Home</a>
</header>

<div class="hvb-tut-cta">
  <a href="/affiliate-tutorial">
    <div><b> 🎬 Affiliate থেকে ইনকাম করবেন কীভাবে?</b><small>ধাপে ধাপে টিউটোরিয়াল ভিডিও ও গাইড দেখে নিন</small></div>
    <em>টিউটোরিয়াল দেখুন →</em>
  </a>
</div>

<div class="wrap">
  <h1>Affiliate Dashboard</h1>
  <p class="lead">আপনার রেফার লিংক, বিক্রি, কমিশন ও টাকা তোলার সব হিসাব এক জায়গায়।</p>

  <div id="bootBox" class="card" style="text-align:center;">
    <span class="hvb-loadrow"><span class="hvb-inline-spin"></span></span>
  </div>

  <div id="authBox" class="hide"></div>
  <div id="joinBox" class="hide"></div>
  <div id="dashBox" class="hide"></div>

  <p style="margin-top:22px;"><a href="/affiliate" class="back-link">← Affiliate Program পেজে ফিরে যান</a></p>
</div>

<script>
(function(){
  var AFF = { token:'', refCode:'', password:'', data:null };
  window._aff = AFF;

  function $(id){ return document.getElementById(id); }
  function show(id){ $(id).classList.remove('hide'); }
  function hide(id){ $(id).classList.add('hide'); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
  function note(id, text, ok){
    var el = $(id); if(!el) return;
    el.textContent = text || '';
    el.className = 'msg ' + (ok ? 'success' : 'error');
  }
  function auth(extra){
    var body = extra || {};
    if(AFF.token) body.token = AFF.token;
    else { body.refCode = AFF.refCode; body.password = AFF.password; }
    return body;
  }
  async function post(url, body){
    var res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    var data = {};
    try { data = await res.json(); } catch(e){}
    return { ok: res.ok, status: res.status, data: data };
  }

  /* ---------------- লগইন স্ক্রিন ---------------- */
  function renderAuth(hasGoogle){
    hide('bootBox'); hide('joinBox'); hide('dashBox'); show('authBox');
    $('authBox').innerHTML =
      (hasGoogle
        ? '<div class="card">' +
            '<h3>অ্যাফিলিয়েট অ্যাকাউন্ট</h3>' +
            '<p class="note" style="margin-top:0;">আপনার Gmail দিয়ে একবার লগইন করলেই হবে — এরপর আর বারবার পাসওয়ার্ড লাগবে না।</p>' +
            '<button class="btn" style="margin-top:12px;" onclick="_aff.google()">Google দিয়ে লগইন / সাইনআপ</button>' +
          '</div>'
        : '') +
      '<div class="card">' +
        '<h3>Ref Code দিয়ে লগইন <span class="badge">পুরোনো নিয়ম</span></h3>' +
        '<div class="field"><label>Ref Code / Username</label><input id="lgRef" type="text" placeholder="যেমন: karim123"></div>' +
        '<div class="field"><label>পাসওয়ার্ড</label><input id="lgPass" type="password" placeholder="পাসওয়ার্ড"></div>' +
        '<button class="btn" onclick="_aff.legacyLogin()">ড্যাশবোর্ড দেখুন</button>' +
        '<div id="lgMsg" class="msg"></div>' +
      '</div>';
  }

  AFF.google = function(){
    if(window.HVBAuth && HVBAuth.signInWithGoogle) HVBAuth.signInWithGoogle('affiliate-dashboard');
    else location.href = '/login';
  };

  AFF.legacyLogin = async function(){
    var ref = ($('lgRef').value || '').trim().toLowerCase();
    var pass = $('lgPass').value || '';
    if(!ref || !pass) return note('lgMsg', 'Ref Code ও পাসওয়ার্ড দিন');
    note('lgMsg', '');
    AFF.token = ''; AFF.refCode = ref; AFF.password = pass;
    var r = await post('/api/affiliate-stats', auth({}));
    if(!r.ok) return note('lgMsg', r.data.error || 'সমস্যা হয়েছে');
    try { sessionStorage.setItem('hvb_aff_ref', ref); sessionStorage.setItem('hvb_aff_pass', pass); } catch(e){}
    renderDash(r.data);
  };

  /* ---------------- নতুন অ্যাফিলিয়েট খোলা ---------------- */
  function renderJoin(email, name){
    hide('bootBox'); hide('authBox'); hide('dashBox'); show('joinBox');
    $('joinBox').innerHTML =
      '<div class="card">' +
        '<h3>অ্যাফিলিয়েট শুরু করুন <span class="badge">' + esc(email) + '</span></h3>' +
        '<p class="note" style="margin-top:0;">শুধু নাম, নাম্বার আর নিজের পছন্দের একটা Ref Code দিন। পাসওয়ার্ড লাগবে না — এই Gmail দিয়েই সবসময় ঢুকতে পারবেন।</p>' +
        '<div class="field" style="margin-top:14px;"><label>আপনার নাম</label><input id="jnName" type="text" value="' + esc(name || '') + '" placeholder="পুরো নাম"></div>' +
        '<div class="field"><label>যোগাযোগের নাম্বার</label><input id="jnContact" type="tel" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX"></div>' +
        '<div class="field"><label>Ref Code (username)</label><input id="jnRef" type="text" placeholder="ইংরেজি অক্ষর/সংখ্যা, যেমন: karim123"></div>' +
        '<button class="btn" id="jnBtn" onclick="_aff.join()">অ্যাফিলিয়েট অ্যাকাউন্ট খুলুন</button>' +
        '<div id="jnMsg" class="msg"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>আগে থেকেই অ্যাফিলিয়েট আছে?</h3>' +
        '<p class="note" style="margin-top:0;">পুরোনো Ref Code ও পাসওয়ার্ড দিলে সেই অ্যাকাউন্ট এই Gmail-এর সাথে জুড়ে যাবে — এরপর আর পাসওয়ার্ড লাগবে না।</p>' +
        '<div class="split" style="margin-top:12px;">' +
          '<div class="field"><input id="lnRef" type="text" placeholder="Ref Code"></div>' +
          '<div class="field"><input id="lnPass" type="password" placeholder="পাসওয়ার্ড"></div>' +
        '</div>' +
        '<button class="btn btn-ghost" onclick="_aff.link()">অ্যাকাউন্ট যুক্ত করুন</button>' +
        '<div id="lnMsg" class="msg"></div>' +
      '</div>';
  }

  AFF.join = async function(){
    var name = ($('jnName').value || '').trim();
    var contact = ($('jnContact').value || '').trim();
    var ref = ($('jnRef').value || '').trim().toLowerCase();
    if(!name) return note('jnMsg', 'আপনার নাম লিখুন');
    if(!/^01[3-9][0-9]{8}$/.test(contact.replace(/[^0-9]/g,''))) return note('jnMsg', 'সঠিক ১১ ডিজিটের নাম্বার দিন');
    if(ref.replace(/[^a-z0-9]/g,'').length < 3) return note('jnMsg', 'Ref Code কমপক্ষে ৩ অক্ষরের হতে হবে');
    $('jnBtn').disabled = true; note('jnMsg','');
    var r = await post('/api/affiliate-signup', auth({ name:name, contact:contact, refCode:ref }));
    $('jnBtn').disabled = false;
    if(!r.ok) return note('jnMsg', r.data.error || 'সমস্যা হয়েছে');
    boot();
  };

  AFF.link = async function(){
    var ref = ($('lnRef').value || '').trim().toLowerCase();
    var pass = $('lnPass').value || '';
    if(!ref || !pass) return note('lnMsg', 'Ref Code ও পাসওয়ার্ড দিন');
    note('lnMsg','');
    var r = await post('/api/affiliate-signup', { token: AFF.token, action:'link', refCode: ref, password: pass });
    if(!r.ok) return note('lnMsg', r.data.error || 'সমস্যা হয়েছে');
    boot();
  };

  /* ---------------- ড্যাশবোর্ড ---------------- */
  var BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  function bn(n){ return String(n == null ? '' : n).replace(/[0-9]/g, function(d){ return BN[+d]; }); }
  var MON = ['জানু','ফেব','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্ট','অক্টো','নভে','ডিসে'];
  function bdate(v){
    var d = new Date(v);
    if(isNaN(d.getTime())) return '';
    var h = d.getHours(), ap = h < 12 ? 'AM' : 'PM', hh = h % 12 || 12;
    return bn(d.getDate()) + ' ' + MON[d.getMonth()] + ' ' + bn(d.getFullYear()) + ', ' + bn(hh) + ':' + bn(('0'+d.getMinutes()).slice(-2)) + ' ' + ap;
  }
  function taka(n){ return bn(Math.round(Number(n) || 0)) + ' ৳'; }

  function renderDash(d){
    AFF.data = d;
    AFF.refCode = d.refCode || AFF.refCode;
    hide('bootBox'); hide('authBox'); hide('joinBox'); show('dashBox');

    var link = location.origin + '/?ref=' + AFF.refCode;
    var minW = Number(d.minWithdraw || 500);
    var available = Number(d.available != null ? d.available : d.pending);
    var held = Number(d.held || 0);
    var hasPay = !!(d.payMethod && d.payAccount);
    var initial = (String(d.name || AFF.refCode || 'H').trim()[0] || 'H').toUpperCase();

    /* ---- কমিশন হিস্টোরি ---- */
    var items = [];
    (d.orders || []).forEach(function(o){
      items.push({ t:o.date, title: (o.course === 'bundle' ? 'Long + Short বিক্রি' : 'Short Course বিক্রি'), amt: Number(o.commission), out:false });
    });
    (d.adjustments || []).forEach(function(a){
      items.push({ t:a.date, title: esc(a.note || 'Admin Adjustment'), amt: Number(a.amount), out:false });
    });
    items.sort(function(a,b){ return new Date(b.t) - new Date(a.t); });
    var history = items.map(function(i){
      return '<div class="row"><span>' + i.title + '<small>' + bdate(i.t) + '</small></span><b>' +
        (i.amt >= 0 ? '+' : '−') + taka(Math.abs(i.amt)) + '</b></div>';
    }).join('');

    /* ---- Withdraw হিস্টোরি ---- */
    var wds = (d.withdrawals || []).slice();
    var paidTotal = 0, pendingTotal = 0;
    var wdRows = wds.map(function(w){
      var st = String(w.status || 'pending').toLowerCase();
      if(st === 'paid' || st === 'approved' || st === 'complete' || st === 'completed'){ paidTotal += w.amount; st = 'paid'; }
      else if(st === 'pending'){ pendingTotal += w.amount; }
      else { st = 'rejected'; }
      var label = st === 'paid' ? 'পেমেন্ট হয়েছে' : (st === 'pending' ? 'প্রসেসিং' : 'বাতিল');
      var to = (w.method || w.account) ? (esc(w.method || '') + ' ' + esc(w.account || '')) : '';
      var when = st === 'paid' && w.paidAt ? bdate(w.paidAt) : bdate(w.date);
      return '<div class="row"><span>' + taka(w.amount) + (to ? ' → ' + to : '') +
        '<small>' + (st === 'paid' ? 'পাঠানো হয়েছে: ' : 'রিকোয়েস্ট: ') + when + '</small></span>' +
        '<span class="chip ' + st + '">' + label + '</span></div>';
    }).join('');

    var wdHistoryCard =
      '<div class="card">' +
        '<h3><span class="ttl"><span class="ico">🧾</span> Withdraw History</span>' +
          '<span class="badge">' + bn(wds.length) + ' টি রিকোয়েস্ট</span></h3>' +
        '<div class="sum">' +
          '<div><div class="k">পেমেন্ট পেয়েছেন</div><div class="v" style="color:var(--mint)">' + taka(paidTotal || d.paidOut) + '</div></div>' +
          '<div><div class="k">প্রসেসিং-এ</div><div class="v" style="color:#FFC46B">' + taka(pendingTotal) + '</div></div>' +
        '</div>' +
        (wdRows || '<div class="empty">এখনো কোনো Withdraw রিকোয়েস্ট পাঠাননি।</div>') +
      '</div>';

    var payCard =
      '<div class="card">' +
        '<h3><span class="ttl"><span class="ico">💳</span> টাকা পাওয়ার নাম্বার</span>' + (hasPay ? '<button class="btn btn-ghost btn-sm" onclick="_aff.editPay()">Edit</button>' : '') + '</h3>' +
        (hasPay
          ? '<div id="payView" class="pay-line"><span class="pm">' + esc(d.payMethod) + '</span><span class="pn">' + esc(d.payAccount) + '</span></div>'
          : '<p class="note" style="margin-top:0;">টাকা তোলার আগে আপনার bKash / Nagad / Rocket নাম্বার যোগ করুন।</p>') +
        '<div id="payForm" class="' + (hasPay ? 'hide' : '') + '" style="margin-top:12px;">' +
          '<div class="field"><label>পেমেন্ট মাধ্যম</label><select id="pmMethod">' +
            '<option value="">বেছে নিন</option>' +
            ['bKash','Nagad','Rocket'].map(function(m){ return '<option value="' + m + '"' + (d.payMethod === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="field"><label>নাম্বার</label><input id="pmAccount" type="tel" inputmode="numeric" maxlength="11" value="' + esc(d.payAccount || '') + '" placeholder="01XXXXXXXXX"></div>' +
          '<button class="btn" id="pmBtn" onclick="_aff.savePay()">নাম্বার সেভ করুন</button>' +
        '</div>' +
        '<div id="pmMsg" class="msg"></div>' +
      '</div>';

    var withdrawCard =
      '<div class="card">' +
        '<h3><span class="ttl"><span class="ico">💰</span> টাকা তুলুন</span>' +
          (held > 0 ? '<span class="chip pending">' + taka(held) + ' প্রসেসিং</span>' : '') + '</h3>' +
        (available < minW
          ? '<p class="note" style="margin-top:0;">কমপক্ষে ' + bn(minW) + ' ৳ হলে Withdraw করা যাবে। আর ' + taka(Math.max(0, minW - available)) + ' হলেই পারবেন।</p>'
          : (!hasPay
              ? '<p class="note" style="margin-top:0;">আগে উপরে আপনার bKash / Nagad / Rocket নাম্বার যোগ করুন।</p>'
              : '<p class="note" style="margin-top:0;">টাকা যাবে: <b style="color:var(--mint)">' + esc(d.payMethod) + ' — ' + esc(d.payAccount) + '</b></p>' +
                '<div class="field" style="margin-top:12px;"><label>কত টাকা তুলবেন (সর্বনিম্ন ' + bn(minW) + ', সর্বোচ্চ ' + bn(available) + ')</label>' +
                '<input id="wdAmount" type="number" min="' + minW + '" max="' + available + '" placeholder="' + available + '"></div>' +
                '<button class="btn" id="wdBtn" onclick="_aff.withdraw()">Withdraw Request পাঠান</button>' +
                '<p class="note">রিকোয়েস্টের ২৪-৪৮ ঘণ্টার মধ্যে আপনার দেওয়া নাম্বারে টাকা পাঠানো হবে।</p>')) +
        '<div id="wdMsg" class="msg"></div>' +
      '</div>';

    $('dashBox').innerHTML =
      '<div class="card hero">' +
        '<div class="who"><div class="avatar">' + esc(initial) + '</div>' +
          '<div><div class="nm">' + esc(d.name) + '</div><div class="rf">@' + esc(AFF.refCode) + '</div></div></div>' +
        '<div class="dash-grid">' +
          '<div class="dash-box"><div class="num">' + bn(d.totalOrders) + '</div><div class="lbl">মোট বিক্রি</div></div>' +
          '<div class="dash-box"><div class="num">' + taka(d.totalSales) + '</div><div class="lbl">বিক্রির টাকা</div></div>' +
          '<div class="dash-box"><div class="num">' + bn(d.commissionPercent) + '%</div><div class="lbl">কমিশন রেট</div></div>' +
          '<div class="dash-box"><div class="num">' + taka(d.paidOut) + '</div><div class="lbl">পেমেন্ট পেয়েছেন</div></div>' +
        '</div>' +
        '<div class="dash-pending"><div class="num">' + taka(available) + '</div><div class="lbl">তোলার মতো ব্যালেন্স</div></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3><span class="ttl"><span class="ico">🔗</span> আপনার রেফার লিংক</span></h3>' +
        '<div id="refLinkText" class="link-box">' + esc(link) + '</div>' +
        '<button class="btn" style="margin-top:12px;" onclick="_aff.copy(this)">লিংক কপি করুন</button>' +
      '</div>' +
      payCard +
      withdrawCard +
      wdHistoryCard +
      (history ? '<div class="card"><h3><span class="ttl"><span class="ico">📊</span> কমিশনের হিসাব</span></h3>' + history + '</div>' : '');
  }

  AFF.copy = function(btn){
    navigator.clipboard.writeText($('refLinkText').textContent).then(function(){
      var old = btn.textContent; btn.textContent = 'কপি হয়েছে ✓';
      setTimeout(function(){ btn.textContent = old; }, 2000);
    });
  };

  AFF.editPay = function(){ $('payForm').classList.remove('hide'); };

  AFF.savePay = async function(){
    var m = $('pmMethod').value || '';
    var a = ($('pmAccount').value || '').replace(/[^0-9]/g,'');
    if(!m) return note('pmMsg', 'bKash / Nagad / Rocket বেছে নিন');
    if(!/^01[3-9][0-9]{8}$/.test(a)) return note('pmMsg', 'সঠিক ১১ ডিজিটের নাম্বার দিন');
    $('pmBtn').disabled = true; note('pmMsg','');
    var r = await post('/api/affiliate-stats', auth({ action:'savePayout', payMethod:m, payAccount:a }));
    $('pmBtn').disabled = false;
    if(!r.ok) return note('pmMsg', r.data.error || 'সেভ করা যায়নি');
    renderDash(r.data);
    note('pmMsg', 'নাম্বার সেভ হয়েছে ✓', true);
  };

  AFF.withdraw = async function(){
    var amount = ($('wdAmount').value || '').trim();
    if(!amount || Number(amount) <= 0) return note('wdMsg', 'কত টাকা তুলবেন লিখুন');
    $('wdBtn').disabled = true; note('wdMsg','');
    var r = await post('/api/withdraw-request', auth({ amount: Number(amount) }));
    $('wdBtn').disabled = false;
    if(!r.ok) return note('wdMsg', r.data.error || 'সমস্যা হয়েছে');
    note('wdMsg', 'রিকোয়েস্ট পাঠানো হয়েছে ✓ (' + r.data.amount + ' ৳ — ' + r.data.method + ' ' + r.data.account + ')', true);
    boot(true);
  };

  /* ---------------- শুরু ---------------- */
  async function boot(keepMsg){
    if(!keepMsg){ show('bootBox'); }
    var r = await post('/api/affiliate-stats', auth({}));
    if(r.ok) return renderDash(r.data);
    if(r.data && r.data.code === 'no_affiliate'){
      var u = (window.HVBAuth && HVBAuth.user) || null;
      var nm = u && u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name);
      return renderJoin(r.data.email || (u && u.email) || '', nm || '');
    }
    renderAuth(!!(window.HVBAuth && HVBAuth.sb));
  }

  function start(){
    var A = window.HVBAuth;
    if(A && A.session && A.session.access_token){
      AFF.token = A.session.access_token;
      return boot();
    }
    var r = '', p = '';
    try { r = sessionStorage.getItem('hvb_aff_ref') || ''; p = sessionStorage.getItem('hvb_aff_pass') || ''; } catch(e){}
    if(r && p){ AFF.refCode = r; AFF.password = p; return boot(); }
    renderAuth(!!(A && A.sb));
  }

  window.addEventListener('DOMContentLoaded', function(){
    if(window.HVBAuth && HVBAuth.whenReady) HVBAuth.whenReady(start);
    else setTimeout(start, 600);
  });
})();
</script>
