<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate Dashboard | HVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C13; --surface:#131826; --surface-2:#1A2133; --line:#242C42;
    --text:#EAF0FF; --muted:#8891A8; --cyan:#5EEAD4; --violet:#A78BFA;
    --grad: linear-gradient(90deg, var(--cyan), var(--violet));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, rgba(94,234,212,0.06), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(167,139,250,0.08), transparent 40%),
                var(--bg);
    color:var(--text); font-family:'Hind Siliguri', sans-serif; line-height:1.65;
  }
  a{ color:inherit; text-decoration:none; }
  header{
    position:sticky; top:0; z-index:20; background:rgba(9,12,19,0.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:34px; height:34px; border-radius:8px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand-text b{ font-family:'Sora',sans-serif; font-size:1.02em; }
  .brand-text span{ font-size:0.65em; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
  .back-link{ color:var(--muted); font-size:0.9em; }
  .wrap{ max-width:700px; margin:0 auto; padding:44px 24px 90px; }
  h1{ font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(1.5em,5vw,2em); margin-bottom:12px; }
  p.lead{ color:var(--muted); margin-bottom:20px; }
  .info-box{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:20px; margin-bottom:30px;
  }
  .info-box h3{ font-family:'Sora',sans-serif; font-size:1.05em; margin-bottom:10px; }
  .info-box li{ color:var(--muted); font-size:0.92em; margin:6px 0 6px 18px; }
  .tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .tab-btn{
    flex:1; padding:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; color:var(--muted); font-weight:600; cursor:pointer; font-size:0.92em;
  }
  .tab-btn.active{ background:var(--grad); color:#0A0D14; border-color:transparent; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .form-group{ margin-bottom:14px; }
  .form-group label{ display:block; font-size:0.85em; color:var(--muted); margin-bottom:6px; }
  .form-group input{
    width:100%; padding:12px 14px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:0.95em; font-family:'Hind Siliguri';
  }
  .form-group input:focus{ outline:none; border-color:var(--cyan); }
  .submit-btn{
    width:100%; background:var(--grad); color:#0A0D14; border:none; padding:13px;
    font-weight:700; border-radius:8px; cursor:pointer; font-size:1em;
  }
  .msg{ font-size:0.88em; margin-top:12px; min-height:1.2em; }
  .msg.error{ color:#F87171; }
  .msg.success{ color:var(--cyan); }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:16px; margin-top:14px;
  }
  .stat-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:0.92em; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row b{ color:var(--cyan); }
  .dashboard{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:22px; margin-top:16px;
  }
  .dash-name{ font-family:'Sora',sans-serif; font-size:1.1em; font-weight:700; margin-bottom:16px; }
  .dash-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .dash-box{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; text-align:center; }
  .dash-box .num{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.3em; color:var(--cyan); }
  .dash-box .lbl{ color:var(--muted); font-size:0.78em; margin-top:4px; }
  .dash-pending{
    background:linear-gradient(135deg, rgba(94,234,212,0.12), rgba(167,139,250,0.14));
    border:1px solid var(--cyan); border-radius:10px; padding:16px; text-align:center; margin-bottom:16px;
  }
  .dash-pending .num{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.6em; color:var(--cyan); }
  .dash-pending .lbl{ color:var(--muted); font-size:0.85em; margin-top:4px; }
  .withdraw-btn{
    width:100%; background:var(--grad); color:#0A0D14; border:none; padding:13px;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:0.95em;
  }
  .withdraw-note{ color:var(--muted); font-size:0.82em; text-align:center; margin-top:8px; }
  .history-title{ font-family:'Sora',sans-serif; font-size:0.95em; margin:20px 0 10px; color:var(--muted); }
  @media (max-width:600px){ .wrap{ padding:30px 18px 70px; } }

  /* Affiliate tutorial চলন্ত ব্যানার */
  .hvb-marquee{ display:block; background:linear-gradient(90deg, rgba(94,234,212,.14), rgba(167,139,250,.16));
    border-bottom:1px solid var(--line); overflow:hidden; white-space:nowrap; cursor:pointer; }
  .hvb-marquee span{ display:inline-block; padding:9px 0; font-weight:600; font-size:.95em;
    animation:hvbslide 18s linear infinite; }
  .hvb-marquee:hover span{ animation-play-state:paused; }
  @keyframes hvbslide{ from{ transform:translateX(100%);} to{ transform:translateX(-100%);} }
</style>
</head>
<body>
<script src="hvb-ref.js"></script>
<script src="hvb-track.js"></script>

<header>
  <a href="index.html" class="brand">
    <img src="hvb-logo.png" alt="HVB Logo">
    <div class="brand-text"><b>HVB</b><span>Hyper Vision Bangla</span></div>
  </a>
  <a href="index.html" class="back-link">← Home</a>
</header>

<a class="hvb-marquee" href="affiliate-tutorial.html"><span>🎬 Affiliate থেকে ইনকাম করবেন কীভাবে? — এখানে চাপুন, টিউটোরিয়াল ভিডিও দেখুন &nbsp;•&nbsp; ফ্রিতে জয়েন করুন, প্রতি বিক্রিতে কমিশন নিন &nbsp;•&nbsp; ক্লিক করুন 👉</span></a>


<div class="wrap">
  <h1>Affiliate Dashboard</h1>
  <p class="lead">আপনার রেফার লিংক, বিক্রি ও কমিশনের সব হিসাব এখানে।</p>

  <div class="panel active" id="loginPanel">
    <div class="form-group">
      <label>আপনার Ref Code</label>
      <input type="text" id="statsRefCode" placeholder="যেমন: karim123">
    </div>
    <div class="form-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="statsPassword" placeholder="পাসওয়ার্ড">
    </div>
    <button type="button" class="submit-btn" onclick="loadStats()">ড্যাশবোর্ড দেখুন</button>
    <div id="statsMsg" class="msg"></div>
  </div>

  <div id="linkBox" class="info-box" style="display:none;"></div>
  <div id="statsCard"></div>
  <p style="margin-top:22px;"><a href="affiliate.html" class="back-link">← Affiliate Program পেজে ফিরে যান</a></p>
</div>

<script>
  function copyRefLink(btn){
    const text = document.getElementById('refLinkText').textContent;
    navigator.clipboard.writeText(text).then(function(){
      const old = btn.textContent;
      btn.textContent = 'কপি হয়েছে ✓';
      setTimeout(function(){ btn.textContent = old; }, 2000);
    });
  }

  function showLink(refCode){
    const link = window.location.origin + '/?ref=' + refCode;
    const box = document.getElementById('linkBox');
    box.style.display = 'block';
    box.innerHTML =
      '<h3 style="font-family:Sora,sans-serif; margin-bottom:8px;">🔗 আপনার রেফার লিংক</h3>' +
      '<p style="color:var(--muted); font-size:0.9em; margin-bottom:12px;">এই লিংক দিয়ে কেউ সাইটে ঢুকে যেকোনো কোর্স কিনলেই ২০% কমিশন আপনার।</p>' +
      '<div id="refLinkText" style="word-break:break-all; background:var(--surface-2); border:1px solid var(--cyan); border-radius:8px; padding:14px; font-weight:700; color:var(--cyan);">' + link + '</div>' +
      '<button type="button" class="submit-btn" style="margin-top:12px;" onclick="copyRefLink(this)">📋 লিংক কপি করুন</button>';
  }

  async function requestWithdraw(){
    try {
      const res = await fetch('/api/withdraw-request', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ refCode: window._currentRefCode, password: window._currentPassword })
      });
      const data = await res.json();
      if(!res.ok){ alert('⚠️ ' + (data.error || 'সমস্যা হয়েছে')); return; }
      alert('✅ Withdraw রিকোয়েস্ট পাঠানো হয়েছে (' + data.amount + ' ৳)। ২৪-৪৮ ঘণ্টার মধ্যে টাকা পাঠানো হবে।');
      loadStats(window._currentRefCode, window._currentPassword);
    } catch(err){ alert('সমস্যা হয়েছে, আবার চেষ্টা করুন।'); }
  }

  async function loadStats(refArg, passArg){
    const refCode = (refArg || document.getElementById('statsRefCode').value || '').trim();
    const password = passArg || document.getElementById('statsPassword').value;
    const msg = document.getElementById('statsMsg');
    const card = document.getElementById('statsCard');
    card.innerHTML = '';
    if(!refCode || !password){
      msg.textContent = '⚠️ Ref Code ও পাসওয়ার্ড দিন';
      msg.className = 'msg error';
      return;
    }
    msg.textContent = 'লোড হচ্ছে...';
    msg.className = 'msg';
    try {
      const res = await fetch('/api/affiliate-stats', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ refCode: refCode, password: password })
      });
      const data = await res.json();
      if(!res.ok){
        msg.textContent = '⚠️ ' + (data.error || 'সমস্যা হয়েছে');
        msg.className = 'msg error';
        return;
      }
      msg.textContent = '';
      document.getElementById('loginPanel').style.display = 'none';
      showLink(refCode);

      let historyHtml = '';
      (data.orders || []).forEach(function(o){
        const courseName = o.course === 'bundle' ? 'Long+Short' : 'Short';
        const d = new Date(o.date);
        const dateStr = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
        historyHtml += '<div class="stat-row"><span>' + dateStr + ' — ' + courseName + '</span><b>+' + o.commission + ' ৳</b></div>';
      });

      const canWithdraw = data.pending >= 1000;
      const withdrawSection = canWithdraw
        ? '<button class="withdraw-btn" onclick="requestWithdraw()">💰 টাকা তুলুন (Withdraw Request পাঠান)</button>' +
          '<p class="withdraw-note">রিকোয়েস্ট পাঠানোর পর ২৪-৪৮ ঘণ্টার মধ্যে আপনার bKash/Nagad নাম্বারে টাকা পাঠানো হবে।</p>'
        : '<p class="withdraw-note">কমপক্ষে ১০০০ ৳ পাওনা হলে Withdraw করা যাবে। আর ' + (1000 - data.pending) + ' ৳ হলেই পারবেন।</p>';

      card.innerHTML =
        '<div class="dashboard">' +
        '<div class="dash-name">👋 ' + data.name + '</div>' +
        '<div class="dash-grid">' +
        '<div class="dash-box"><div class="num">' + data.totalOrders + '</div><div class="lbl">মোট বিক্রি</div></div>' +
        '<div class="dash-box"><div class="num">' + data.totalSales + ' ৳</div><div class="lbl">মোট বিক্রির টাকা</div></div>' +
        '<div class="dash-box"><div class="num">' + data.commissionPercent + '%</div><div class="lbl">কমিশন রেট</div></div>' +
        '<div class="dash-box"><div class="num">' + data.paidOut + ' ৳</div><div class="lbl">এ পর্যন্ত পেয়েছেন</div></div>' +
        '</div>' +
        '<div class="dash-pending"><div class="num">' + data.pending + ' ৳</div><div class="lbl">এখনো পাওনা (Pending)</div></div>' +
        withdrawSection +
        '</div>' +
        (historyHtml ? '<div class="history-title">বিক্রির হিস্টোরি</div><div class="stat-card">' + historyHtml + '</div>' : '');

      window._currentRefCode = refCode;
      window._currentPassword = password;
    } catch(err){
      msg.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন।';
      msg.className = 'msg error';
    }
  }

  window.addEventListener('DOMContentLoaded', function(){
    let r = '', p = '';
    try {
      r = sessionStorage.getItem('hvb_aff_ref') || '';
      p = sessionStorage.getItem('hvb_aff_pass') || '';
    } catch(e){}
    if(r && p){
      document.getElementById('statsRefCode').value = r;
      document.getElementById('statsPassword').value = p;
      loadStats(r, p);
    }
  });
</script>
</body>
</html>
