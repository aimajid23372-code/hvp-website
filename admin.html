  <style>
:root {
  --bg-obsidian: #05070E;
  --bg-surface: #0B0F1A;
  --bg-elevated: #111827;
  --accent-cyan: #00E5FF;
  --accent-violet: #7C3AED;
  --accent-pink: #EC4899;
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --border-hairline: rgba(255, 255, 255, 0.08);
  --font-display: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Noto Sans Bengali', 'Plus Jakarta Sans', sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg-obsidian);
  color: var(--text-primary);
  font-family: var(--font-body);
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, .font-display {
  font-family: var(--font-display);
  letter-spacing: -0.015em;
}
.font-num { font-family: 'Plus Jakarta Sans', sans-serif; }
.font-mono-num { font-family: 'JetBrains Mono', monospace; }

/* Silky Obsidian Ambient Glows - ZERO Grid Lines */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(65% 45% at 15% 8%, color-mix(in srgb, var(--accent-cyan) 11%, transparent) 0%, transparent 70%),
    radial-gradient(55% 45% at 88% 18%, color-mix(in srgb, var(--accent-violet) 14%, transparent) 0%, transparent 72%),
    radial-gradient(50% 45% at 50% 92%, color-mix(in srgb, var(--accent-violet) 8%, transparent) 0%, transparent 70%),
    var(--bg-obsidian);
}

.glass-nav {
  background: rgba(5, 7, 14, 0.78);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-hairline);
}

.lux-card {
  background: linear-gradient(180deg, rgba(17, 24, 39, 0.72) 0%, rgba(11, 15, 26, 0.92) 100%);
  border: 1px solid var(--border-hairline);
  backdrop-filter: blur(16px);
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s ease, box-shadow 0.28s ease;
}
.lux-card:hover {
  border-color: color-mix(in srgb, var(--accent-cyan) 32%, transparent);
  box-shadow: 0 20px 50px -20px color-mix(in srgb, var(--accent-cyan) 22%, transparent), 0 0 0 1px color-mix(in srgb, var(--accent-violet) 18%, transparent);
}

.gradient-text {
  background: linear-gradient(110deg, #FFFFFF 10%, var(--accent-cyan) 55%, #C084FC 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-violet) 100%);
  color: #040711;
  font-weight: 700;
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--accent-cyan) 45%, transparent);
}
.btn-primary:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
  box-shadow: 0 14px 36px -8px color-mix(in srgb, var(--accent-cyan) 60%, transparent);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #F8FAFC;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.24);
}

.pill-badge {
  background: rgba(0, 229, 255, 0.08);
  border: 1px solid rgba(0, 229, 255, 0.24);
  color: #7DD3FC;
}

/* Custom Range Slider */
input[type="range"].hvb-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-cyan), var(--accent-violet));
  outline: none;
}
input[type="range"].hvb-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 3px solid var(--accent-cyan);
  box-shadow: 0 0 18px rgba(0, 229, 255, 0.65);
  cursor: pointer;
}
input[type="range"].hvb-slider::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #FFFFFF;
  border: 3px solid var(--accent-cyan);
  box-shadow: 0 0 18px rgba(0, 229, 255, 0.65);
  cursor: pointer;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #05070E; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 255, 0.45); }

.toast-enter {
  animation: toastSlide 0.25s ease forwards;
}
@keyframes toastSlide {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>

  function bindAdminEvents() {
    var loginForm = document.getElementById('admin-login-form');
    if (loginForm) {
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var pwd = document.getElementById('admin-pwd-input').value;
        var err = document.getElementById('admin-login-error');
        if (pwd === state.password || pwd === 'sayba123?') {
          err.classList.add('hidden');
          document.getElementById('hvb-admin-lock').classList.add('hidden');
          document.getElementById('hvb-admin-app').classList.remove('hidden');
          renderAdmin();
          if (isLiveHost()) syncWithLiveApi(null);
        } else {
          err.textContent = 'ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিয়ে আবার চেষ্টা করুন।';
          err.classList.remove('hidden');
        }
      });
    }

    var togglePwd = document.getElementById('toggle-pwd-vis');
    if (togglePwd) {
      togglePwd.addEventListener('click', function () {
        var inp = document.getElementById('admin-pwd-input');
        inp.type = inp.type === 'password' ? 'text' : 'password';
      });
    }

    var mobileBtn = document.getElementById('admin-mobile-menu-btn');
    if (mobileBtn) {
      mobileBtn.addEventListener('click', function () {
        document.getElementById('admin-sidebar').classList.toggle('hidden');
      });
    }

    var logoutBtn = document.getElementById('admin-logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', function () {
        document.getElementById('hvb-admin-app').classList.add('hidden');
        document.getElementById('hvb-admin-lock').classList.remove('hidden');
        document.getElementById('admin-pwd-input').value = '';
      });
    }

    var syncBtn = document.getElementById('admin-sync-live-btn');
    if (syncBtn) syncBtn.addEventListener('click', function () { syncWithLiveApi(null); });

    var saveAllBtn = document.getElementById('admin-save-all-btn');
    if (saveAllBtn) saveAllBtn.addEventListener('click', function () { saveState(false); });

    document.querySelectorAll('.admin-cat-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentCat = btn.getAttribute('data-cat');
        currentSub = CATEGORY_META[currentCat].tabs[0].id;
        renderAdmin();
        if (window.innerWidth < 1024) document.getElementById('admin-sidebar').classList.add('hidden');
      });
    });

    document.getElementById('admin-subtabs').addEventListener('click', function (e) {
      var btn = e.target.closest('.admin-sub-btn');

    });

      var t = e.target;
      var rangeBtn = t.closest('.range-btn');
      if (rangeBtn) { currentRange = rangeBtn.getAttribute('data-range'); renderAdmin(); return; }

      var selC = t.closest('.edit-course-select');
      if (selC) { selectedCourseEditId = selC.getAttribute('data-edit-course'); renderAdmin(); return; }

      if (t.id === 'add-new-course-btn') {
        var nid = 'course-' + Date.now();
        state.courses.push({
          id: nid, slug: nid, url: '/' + nid, order: state.courses.length + 1,
          badge: 'নতুন কোর্স', category: 'short', title: 'New AI Course', bnTitle: 'নতুন AI অ্যানিমেশন কোর্স',
          subtitle: 'কোর্সের বিস্তারিত বিবরণ এখানে লিখুন।', regularPrice: 1000, price: 599,
          couponCode: 'HVB50', couponDiscount: 50, modulesCount: 1, duration: '৬ মাসের সম্পূর্ণ অ্যাকসেস',
          repoBanner: '/banner-short.webp', repoThumb: '/short-thumb.jpg', fallbackKey: 'short',
          students: 'নতুন ব্যাচ', rating: '5.0', highlights: ['৬ মাসের অ্যাকসেস'],
          modules: [{ num: '০১', title: 'শুরু ও সেটআপ', lessons: ['বেসিক গাইড'] }]
        });
        selectedCourseEditId = nid;
        saveState(false); renderAdmin(); return;
      }

      if (t.id === 'delete-course-btn') {
        state.courses = state.courses.filter(function (c) { return c.id !== selectedCourseEditId; });
        selectedCourseEditId = state.courses[0].id;
        saveState(false); renderAdmin(); return;
      }

      if (t.id === 'save-course-meta-btn') {
        var c = state.courses.find(function (x) { return x.id === selectedCourseEditId; });
        if (c) {
          c.bnTitle = document.getElementById('ce-bnTitle').value.trim();
          c.title = document.getElementById('ce-title').value.trim();
          c.price = Number(document.getElementById('ce-price').value) || c.price;
          c.regularPrice = Number(document.getElementById('ce-regPrice').value) || c.regularPrice;
          c.order = Number(document.getElementById('ce-order').value) || c.order;
          c.repoBanner = document.getElementById('ce-banner').value.trim();
          c.subtitle = document.getElementById('ce-sub').value.trim();
          saveState(false); renderAdmin();
        }
        return;
      }

      if (t.id === 'add-mod-btn') {
        var c2 = state.courses.find(function (x) { return x.id === selectedCourseEditId; });
        var mt = document.getElementById('new-mod-title').value.trim();
        if (c2 && mt) {
          c2.modules.push({ num: String(c2.modules.length + 1).padStart(2, '0'), title: mt, lessons: ['নতুন লেসন'] });
          c2.modulesCount = c2.modules.length;
          saveState(false); renderAdmin();
        }
        return;
      }

      var delMod = t.closest('.del-mod-btn');
      if (delMod) {
        var c3 = state.courses.find(function (x) { return x.id === selectedCourseEditId; });
        if (c3) {
          c3.modules.splice(Number(delMod.getAttribute('data-del-mod')), 1);
          c3.modulesCount = c3.modules.length;
          saveState(false); renderAdmin();
        }
        return;
      }

      if (t.id === 'add-coupon-btn') {
        var code = document.getElementById('cp-code').value.trim().toUpperCase();
        var type = document.getElementById('cp-type').value;
        var val = Number(document.getElementById('cp-val').value);
        if (code && val > 0) {
          state.coupons.unshift({ code: code, type: type, value: val, course: 'all', active: true, uses: 0 });
          saveState(false); renderAdmin();
        }
        return;
      }

      var togCp = t.closest('.toggle-cp-btn');
      if (togCp) { var idx = Number(togCp.getAttribute('data-toggle-cp')); state.coupons[idx].active = !state.coupons[idx].active; saveState(true); renderAdmin(); return; }

      var delCp = t.closest('.del-cp-btn');
      if (delCp) { state.coupons.splice(Number(delCp.getAttribute('data-del-cp')), 1); saveState(false); renderAdmin(); return; }

      var appReq = t.closest('.approve-req-btn');
      if (appReq) { state.requests[Number(appReq.getAttribute('data-approve-req'))].status = 'planned'; saveState(false); renderAdmin(); return; }

      var ofBtn = t.closest('.of-btn');
      if (ofBtn) { orderFilter = ofBtn.getAttribute('data-of'); renderAdmin(); return; }

      if (t.id === 'open-grant-modal-btn') {
        var m = document.getElementById('manual-grant-modal');
        m.classList.remove('hidden'); m.classList.add('flex');
        return;
      }

      var mpBtn = t.closest('.mark-paid-btn');
      if (mpBtn) {
        var oid = mpBtn.getAttribute('data-mark-paid');
        var ord = state.orders.find(function (o) { return o.id === oid; });
        if (ord) { ord.status = 'paid'; saveState(false); renderAdmin(); }
        return;
      }

      if (t.id === 'bulk-mark-paid-btn') {
        state.orders.forEach(function (o) { if (o.status === 'pending') o.status = 'paid'; });
        saveState(false); renderAdmin(); return;
      }

      if (t.id === 'export-orders-csv-btn') {
        var csv = 'ID,Name,Phone,Email,Course,Amount,Method,TrxID,Status,Date\n' +
          state.orders.map(function (o) { return [o.id, o.name, o.phone, o.email, o.course, o.amount, o.method, o.trx, o.status, o.date].join(','); }).join('\n');
        var blob = new Blob([csv], { type: 'text/csv' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hvb-orders.csv'; a.click();
        toast('CSV ফাইল ডাউনলোড হয়েছে!'); return;
      }

      if (t.id === 'run-bulk-import-btn') {
        var txt = document.getElementById('bulk-import-text').value.trim();
        if (!txt) return;
        var lines = txt.split('\n').filter(Boolean);
        lines.forEach(function (line) {
          var p = line.split(',').map(function (s) { return s.trim(); });
          if (p[0]) {
            state.orders.unshift({
              id: 'IMP-' + Math.floor(1000 + Math.random() * 9000),
              name: p[0], email: p[1] || 'student@hypervisionbd.com', phone: p[2] || '01700000000',
              course: p[3] || 'Long + Short Bundle', amount: 999, method: 'Legacy Import', trx: 'LEGACY', status: 'paid',
              date: new Date().toISOString().slice(0, 10)
            });
          }
        });
        saveState(true); toast(lines.length + ' জন শিক্ষার্থী সফলভাবে ইমপোর্ট হয়েছে!'); renderAdmin(); return;
      }

      if (t.id === 'auto-clean-reviews-btn') {
        state.reviews.forEach(function (r) {
          if (window.HVBReviews) {
            var cl = window.HVBReviews.cleanReviewerName(r.rawName, r.course);
            r.rawName = cl.name;
            r.course = cl.course;
          }
        });
        saveState(true); toast('সব রিভিউর নামের বাগ ১ ক্লিকে পরিষ্কার হয়েছে!'); renderAdmin(); return;
      }

      var delRev = t.closest('.del-rev-btn');
      if (delRev) { state.reviews.splice(Number(delRev.getAttribute('data-del-rev')), 1); saveState(false); renderAdmin(); return; }

      var addAff = t.closest('.add-aff-btn');
      if (addAff) {
        var a = state.affiliates[Number(addAff.getAttribute('data-add-aff'))];
        if (a) { a.balance += 200; a.earned += 200; saveState(true); toast(a.name + '-এর ওয়ালেটে ৳200 যোগ হয়েছে!'); renderAdmin(); }
        return;
      }

      var wdBtn = t.closest('.wd-act-btn');
      if (wdBtn) {
        var wi = Number(wdBtn.getAttribute('data-wd-idx'));
        state.withdrawals[wi].status = wdBtn.getAttribute('data-wd-act');
        saveState(false); renderAdmin(); return;
      }

      if (t.id === 'save-aff-settings-btn') {
        state.affiliateSettings.commissionPercent = Number(document.getElementById('aff-comm').value) || 20;
        state.affiliateSettings.minWithdraw = Number(document.getElementById('aff-min').value) || 500;
        saveState(false); return;
      }

      var tplBtn = t.closest('.tpl-pick-btn');
      if (tplBtn) {
        var tid = tplBtn.getAttribute('data-tpl');
        var found = DEFAULTS.templates.find(function (x) { return x.id === tid; });
        if (found) {
          state.activeTemplate = found.id;
          state.colors = { bg: found.bg, surface: found.surface, cyan: found.cyan, violet: found.violet };
          saveState(true); toast(found.name + ' টেমপ্লেট অ্যাক্টিভেট হয়েছে!'); renderAdmin();
        }
        return;
      }

      if (t.id === 'apply-custom-theme-btn') {
        state.colors.cyan = document.getElementById('clr-cyan').value;
        state.colors.violet = document.getElementById('clr-violet').value;
        state.fontDisplay = document.getElementById('font-picker').value;
        saveState(false); return;
      }

      if (t.id === 'reset-logo-btn') {
        state.customLogoDataUrl = '';
        saveState(false); renderAdmin(); return;
      }

      if (t.id === 'save-hero-btn') {
        state.hero.badge = document.getElementById('he-badge').value.trim();
        state.hero.title = document.getElementById('he-title').value.trim();
        state.hero.subtitle = document.getElementById('he-sub').value.trim();
        state.hero.ctaPrimary = document.getElementById('he-cta1').value.trim();
        state.hero.ctaSecondary = document.getElementById('he-cta2').value.trim();
        saveState(false); return;
      }

      if (t.id === 'save-monetize-btn') {
        state.monetization.months = document.getElementById('me-months').value.trim();
        state.monetization.usdToBdt = Number(document.getElementById('me-bdt').value) || 120;
        state.monetization.rate100k = document.getElementById('me-100k').value.trim();
        state.monetization.rate1m = document.getElementById('me-1m').value.trim();
        saveState(false); return;
      }

      if (t.id === 'save-footer-btn') {
        state.footer.email = document.getElementById('fe-email').value.trim();
        state.footer.tagline = document.getElementById('fe-tagline').value.trim();
        saveState(false); return;
      }

      if (t.id === 'add-faq-btn') {
        var fq = document.getElementById('new-faq-q').value.trim();
        var fa = document.getElementById('new-faq-a').value.trim();
        if (fq && fa) { state.faqs.push({ q: fq, a: fa }); saveState(false); renderAdmin(); }
        return;
      }

      var delFaq = t.closest('.del-faq-btn');
      if (delFaq) { state.faqs.splice(Number(delFaq.getAttribute('data-del-faq')), 1); saveState(false); renderAdmin(); return; }

      if (t.id === 'save-code-btn') {
        state.customCss = document.getElementById('cc-css').value;
        state.customJs = document.getElementById('cc-js').value;
        saveState(false); return;
      }

      if (t.id === 'save-pwd-btn') {
        var np = document.getElementById('new-admin-pwd').value.trim();
        if (np.length >= 4) { state.password = np; saveState(true); toast('অ্যাডমিন পাসওয়ার্ড আপডেট হয়েছে!'); }
        return;
      }

      if (t.id === 'pull-api-btn') { syncWithLiveApi(null); return; }
      if (t.id === 'push-api-btn') { syncWithLiveApi({ action: 'save_settings', settings: state }); return; }

      if (t.id === 'download-json-btn') {
        var jb = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var dl = document.createElement('a'); dl.href = URL.createObjectURL(jb); dl.download = 'hvb-cms-backup.json'; dl.click();
        toast('JSON ব্যাকআপ ডাউনলোড হয়েছে!'); return;
      }
    });

    panel.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'order-search-input') {
        orderSearch = e.target.value;
        renderAdmin();
        var inp = document.getElementById('order-search-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      }
    });

    panel.addEventListener('change', function (e) {
      if (e.target && e.target.id === 'logo-file-input' && e.target.files[0]) {
        var reader = new FileReader();
        reader.onload = function (ev) {
          state.customLogoDataUrl = ev.target.result;
          saveState(true); toast('নতুন গোল লোগো আপলোড ও সেট হয়েছে!'); renderAdmin();
        };
        reader.readAsDataURL(e.target.files[0]);
      }
      if (e.target && e.target.id === 'restore-json-input' && e.target.files[0]) {
        var r2 = new FileReader();
        r2.onload = function (ev) {
          try {
            var obj = JSON.parse(ev.target.result);
            if (obj && obj.courses) {
              Object.assign(state, obj);
              saveState(true); toast('JSON ব্যাকআপ রিস্টোর সফল হয়েছে!'); renderAdmin();
            }
          } catch (err) { toast('সঠিক JSON ফাইল নয়!', 'error'); }
        };
        r2.readAsText(e.target.files[0]);
      }
    });
  }

  window.initHVBAdmin = function () {
    bindAdminEvents();
  };
})();
</script>
  <script>
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function() { window.initHVBAdmin(); if (window.lucide) window.lucide.createIcons(); });
    else { window.initHVBAdmin(); if (window.lucide) window.lucide.createIcons(); }
  </script>
</body>
</html>
