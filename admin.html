  function compressImage(file, maxW, quality, cb) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', quality || 0.78));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

        if (!c) return;
        try {
          const d = await apiPost({ action: 'upload_image', folder: 'courses', data_url: dataUrl });
          c.customBannerDataUrl = d.url || dataUrl;
        } catch (ex) { c.customBannerDataUrl = dataUrl; }
        render(); saveCmsLive(true);
      });
    }
    if (e.target.id === 'logo-file-input' && e.target.files[0]) {
      compressImage(e.target.files[0], 320, 0.85, (dataUrl) => { state.customLogoDataUrl = dataUrl; saveCmsLive(true); });
    }
  });
})();
</script>
</body>
</html>
