<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Withdraw Requests | HVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C13; --surface:#131826; --surface-2:#1A2133; --line:#242C42;
    --text:#EAF0FF; --muted:#8891A8; --cyan:#5EEAD4; --violet:#A78BFA;
    --grad: linear-gradient(90deg, var(--cyan), var(--violet));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Hind Siliguri', sans-serif; line-height:1.65; }
  a{ color:inherit; text-decoration:none; }
  header{
    position:sticky; top:0; background:rgba(9,12,19,0.9); border-bottom:1px solid var(--line);
    padding:14px 24px; display:flex; align-items:center; gap:10px;
  }
  header img{ width:32px; height:32px; border-radius:8px; }
  .wrap{ max-width:800px; margin:0 auto; padding:40px 24px 80px; }
  h1{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.6em; margin-bottom:20px; }
  .login-box{ display:flex; gap:8px; margin-bottom:24px; }
  .login-box input{
    flex:1; padding:12px 14px; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:0.95em;
  }
  .login-box button{
    background:var(--grad); color:#0A0D14; border:none; padding:0 22px;
    border-radius:8px; font-weight:700; cursor:pointer;
  }
  .req-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:18px; margin-bottom:14px;
  }
  .req-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:0.9em; }
  .req-row span:first-child{ color:var(--muted); }
  .amount{ color:var(--cyan); font-family:'Sora',sans-serif; font-weight:700; font-size:1.2em; }
  .approve-btn{
    width:100%; margin-top:12px; background:var(--grad); color:#0A0D14; border:none;
    padding:11px; border-radius:8px; font-weight:700; cursor:pointer;
  }
  .empty{ color:var(--muted); text-align:center; padding:40px 0; }
  .msg{ font-size:0.88em; margin-bottom:16px; }
  .msg.error{ color:#F87171; }
</style>
</head>
<body>
<script src="hvb-ref.js"></script>

<header>
  <img src="hvb-logo.png" alt="HVB">
  <b style="font-family:'Sora',sans-serif;">HVB Admin</b>
</header>

<div class="wrap">
  <h1>Withdraw Requests</h1>

  <div class="login-box">
    <input type="password" id="adminPassword" placeholder="Admin পাসওয়ার্ড দিন">
    <button type="button" onclick="loadRequests()">Load</button>
  </div>
  <div id="msg" class="msg"></div>
  <div id="requestsArea"></div>
</div>

<script>
  async function loadRequests(){
    const pw = document.getElementById('adminPassword').value;
    const msg = document.getElementById('msg');
    const area = document.getElementById('requestsArea');
    area.innerHTML = '';
    msg.textContent = 'লোড হচ্ছে...';
    msg.className = 'msg';

    try {
      const res = await fetch('/api/admin-withdrawals', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ adminPassword: pw, action: 'list' })
      });
      const data = await res.json();
      if(!res.ok){
        msg.textContent = '⚠️ ' + (data.error || 'সমস্যা হয়েছে');
        msg.className = 'msg error';
        return;
      }
      msg.textContent = '';
      const pending = (data.requests || []).filter(r => r.status === 'pending');
      const paid = (data.requests || []).filter(r => r.status === 'paid');

      if(pending.length === 0){
        area.innerHTML = '<div class="empty">এখন কোনো Pending রিকোয়েস্ট নেই।</div>';
      } else {
        pending.forEach(function(r){
          const d = new Date(r.created_at);
          const dateStr = d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
          const card = document.createElement('div');
          card.className = 'req-card';
          card.innerHTML =
            '<div class="req-row"><span>নাম</span><span>' + r.name + '</span></div>' +
            '<div class="req-row"><span>bKash/Nagad নাম্বার</span><span>' + r.contact + '</span></div>' +
            '<div class="req-row"><span>Ref Code</span><span>' + r.ref_code + '</span></div>' +
            '<div class="req-row"><span>রিকোয়েস্ট তারিখ</span><span>' + dateStr + '</span></div>' +
            '<div class="req-row"><span>পরিমাণ</span><span class="amount">' + r.amount + ' ৳</span></div>' +
            '<button class="approve-btn" data-id="' + r.id + '">✅ টাকা পাঠিয়েছি — Approve করুন</button>';
          area.appendChild(card);
        });
        area.querySelectorAll('.approve-btn').forEach(function(btn){
          btn.addEventListener('click', function(){ approveRequest(btn.dataset.id, pw); });
        });
      }

      if(paid.length > 0){
        const h = document.createElement('h3');
        h.style.cssText = 'margin:26px 0 12px; font-family:Sora,sans-serif; color:var(--muted); font-size:1em;';
        h.textContent = 'আগে Approve করা হয়েছে (' + paid.length + ')';
        area.appendChild(h);
        paid.forEach(function(r){
          const card = document.createElement('div');
          card.className = 'req-card';
          card.style.opacity = '0.6';
          card.innerHTML =
            '<div class="req-row"><span>নাম</span><span>' + r.name + '</span></div>' +
            '<div class="req-row"><span>পরিমাণ</span><span class="amount">' + r.amount + ' ৳ ✓ Paid</span></div>';
          area.appendChild(card);
        });
      }
    } catch(err){
      msg.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন।';
      msg.className = 'msg error';
    }
  }

  async function approveRequest(id, pw){
    if(!confirm('নিশ্চিত করছেন যে আপনি নিজে bKash/Nagad দিয়ে টাকা পাঠিয়ে দিয়েছেন?')) return;
    try {
      const res = await fetch('/api/admin-withdrawals', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ adminPassword: pw, action: 'approve', requestId: id })
      });
      if(res.ok){ loadRequests(); }
      else { alert('সমস্যা হয়েছে'); }
    } catch(err){ alert('সমস্যা হয়েছে'); }
  }
</script>

</body>
</html>
