    const el = document.createElement('div');

      (isErr ? 'bg-rose-950 border-rose-500/40 text-rose-100' : 'bg-[#0B1222] border-cyan-400/40 text-cyan-100');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function pushLiveToSupabase(showMsg) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    st.textContent = '⏳ লাইভ ওয়েবসাইটে সেভ হচ্ছে...';

      const res = await fetch('/api/admin', {

      if (showMsg) toast('সার্ভার এরর: ' + err.message, true);
    }
  }

  function compressImage(file, maxW, quality, cb) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(c.toDataURL('image/jpeg', quality || 0.78));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function render() {
    const listEl = document.getElementById('course-list');
    const edEl = document.getElementById('course-editor');
    document.getElementById('course-count').textContent = state.courses.length;
    if (!state.courses.find(c => c.id === selectedId) && state.courses.length) selectedId = state.courses[0].id;
    const course = state.courses.find(c => c.id === selectedId);

    listEl.innerHTML = state.courses.map(c => {
      const active = c.id === selectedId;
      return '<button type="button" data-sel="' + esc(c.id) + '" class="sel-course w-full text-left p-3.5 rounded-2xl border transition ' +

        '<div class="text-[11px] text-slate-400 mt-0.5">' + esc(c.url || ('/' + c.slug)) + '</div>' +
      '</button>';
    }).join('');

    if (!course) { edEl.innerHTML = '<div class="text-sm text-slate-400">কোনো কোর্স নেই।</div>'; return; }

    const previewImg = course.customBannerDataUrl || course.repoBanner || '/banner-short.webp';

      '</div>' +
      '<div class="p-4 rounded-2xl bg-[#070B14] border border-dashed border-cyan-400/40 flex flex-col sm:flex-row items-start sm:items-center gap-4">' +
        '<img id="ce-preview-img" src="' + esc(previewImg) + '" class="w-40 h-24 rounded-xl object-cover border border-white/15 bg-black shrink-0" alt="Preview" />' +
        '<div class="space-y-2 flex-1">' +
          '<div class="text-xs font-bold text-cyan-300">কোর্স প্রিভিউ / থাম্বনেইল ছবি আপলোড করুন</div>' +
          '<input id="ce-banner-file" type="file" accept="image/*" class="block w-full text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-cyan-500/20 file:text-cyan-200 file:font-semibold cursor-pointer" />' +
          '<div class="text-[11px] text-slate-400">ছবি সিলেক্ট করলেই অটোমেটিক লাইভ ওয়েবসাইটে সেট হয়ে যাবে!</div>' +
        '</div>' +
      '</div>' +
      '<div class="grid sm:grid-cols-2 gap-4">' +
        '<div><label class="text-xs text-slate-400 block mb-1">কোর্সের বাংলা নাম</label><input id="ce-bnTitle" value="' + esc(course.bnTitle) + '" class="w-full px-3.5 py-2.5 rounded-xl bg-[#070B14] border border-white/10 text-sm text-white" /></div>' +
        '<div><label class="text-xs text-slate-400 block mb-1">ব্যাজ লেখা (উপরে কোনায়)</label><input id="ce-badge" value="' + esc(course.badge || '') + '" class="w-full px-3.5 py-2.5 rounded-xl bg-[#070B14] border border-white/10 text-sm text-white" /></div>' +
        '<div><label class="text-xs text-slate-400 block mb-1">অফার মূল্য (৳)</label><input id="ce-price" type="number" value="' + course.price + '" class="w-full px-3.5 py-2.5 rounded-xl bg-[#070B14] border border-white/10 text-sm text-white font-num" /></div>' +

  document.getElementById('add-course-btn').addEventListener('click', () => {
    const nid = 'course-' + Date.now();
    state.courses.push({
      id: nid, slug: nid, url: '/' + nid, order: state.courses.length + 1,
      badge: 'নতুন কোর্স', category: 'short', title: 'New Course', bnTitle: 'নতুন AI কোর্স',
      subtitle: 'কোর্সের বিবরণ এখানে লিখুন।', regularPrice: 800, price: 399,
      couponCode: 'HVB50', repoBanner: '/banner-short.webp'
    });
    selectedId = nid;
    render();
    pushLiveToSupabase(true);
  });

  document.getElementById('course-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.sel-course');
    if (btn) { selectedId = btn.getAttribute('data-sel'); render(); }
  });

  document.getElementById('course-editor').addEventListener('click', (e) => {
    if (e.target.id === 'save-course-btn') {
      const c = state.courses.find(x => x.id === selectedId);
      if (c) {
        c.bnTitle = document.getElementById('ce-bnTitle').value.trim();
        c.badge = document.getElementById('ce-badge').value.trim();
        c.price = Number(document.getElementById('ce-price').value) || c.price;
        c.regularPrice = Number(document.getElementById('ce-regPrice').value) || c.regularPrice;
        c.order = Number(document.getElementById('ce-order').value) || c.order;
        c.subtitle = document.getElementById('ce-sub').value.trim();
        render();
        pushLiveToSupabase(true);
      }
    }
    if (e.target.id === 'del-course-btn') {
      if (!confirm('এই কোর্সটি কি সত্যিই লাইভ ওয়েবসাইট থেকে ডিলিট করতে চান?')) return;
      state.courses = state.courses.filter(x => x.id !== selectedId);
      selectedId = state.courses[0] ? state.courses[0].id : '';
      render();
      pushLiveToSupabase(true);
    }
  });

  document.getElementById('course-editor').addEventListener('change', (e) => {
    if (e.target.id === 'ce-banner-file' && e.target.files[0]) {
      compressImage(e.target.files[0], 900, 0.78, async (dataUrl) => {
        const c = state.courses.find(x => x.id === selectedId);
        if (!c) return;
        // Try uploading directly to Supabase Storage first, fallback to compressed dataUrl
        try {
          const r = await fetch('/api/admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
            body: JSON.stringify({ adminPassword, action: 'upload_image', folder: 'courses', data_url: dataUrl })
          });
          const d = await r.json();
          c.customBannerDataUrl = (r.ok && d.url) ? d.url : dataUrl;
        } catch (ex) {
          c.customBannerDataUrl = dataUrl;
        }
        render();
        pushLiveToSupabase(true);
      });
    }
  });
})();
</script>
</body>
</html>
