<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVB Course | AI Video Learning</title><meta name="description" content="HVB-এর প্রফেশনাল বাংলা AI ভিডিও কোর্সের বিস্তারিত, মূল্য ও নিরাপদ অনলাইন enrollment।">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hvb-theme.css"><link rel="stylesheet" href="hvb-ui.css"><link rel="stylesheet" href="hvb-ui-extra.css">
<style>:root{--bg:#05070D;--surface:#0F1421;--surface-2:#161D2E;--line:#212A42;--text:#F2F6FF;--muted:#9AA5BF;--cyan:#3FC7F2;--violet:#7C6BF5;--grad:linear-gradient(103deg,#B4F0F0,#3FC7F2 45%,#7C6BF5)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:rgba(5,7,13,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;gap:10px;align-items:center}.brand img{width:38px;height:38px;border-radius:8px}.brand b{font-family:Sora}.back{color:var(--muted)}main{max-width:920px;margin:auto;padding:38px 20px 100px}.eyebrow{color:var(--cyan);font-size:.78em;text-transform:uppercase}h1{font:800 clamp(1.7em,5vw,2.8em)/1.25 Sora;margin:8px 0 18px}.cover{width:100%;aspect-ratio:16/9;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.description{color:var(--muted);font-size:1.05em;white-space:pre-wrap;margin:24px 0}.detail-section{margin:34px 0}.detail-section h2{font:700 1.35em Sora;margin:0 0 14px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-item{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--text)}.detail-item:before{content:'✓';color:var(--cyan);font-weight:800;margin-right:9px}.support-note{padding:18px;border:1px solid var(--line);border-left:3px solid var(--cyan);background:var(--surface);border-radius:7px;color:var(--muted)}.buy{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.price{font:800 1.7em Sora;color:var(--cyan)}.old{text-decoration:line-through;color:var(--muted);margin-right:8px}.btn{border:0;border-radius:8px;padding:13px 26px;background:var(--grad);color:#04121F;font-family:inherit;font-size:.95em;font-weight:700;cursor:pointer}.btn.hvb-wide{width:100%}.overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px}.overlay.on{display:flex}.modal{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);padding:24px;border-radius:14px;position:relative}.close{position:absolute;right:16px;top:14px;border:0;background:none;color:var(--muted);font-size:1.3em;cursor:pointer}.modal h3{font:700 1.1em Sora;margin:0 0 6px}.modal .price-tag{color:var(--cyan);font-weight:700;margin-bottom:18px}.promo-box{display:flex;gap:8px;margin-bottom:6px}.promo-box input{flex:1}.promo-btn{background:var(--surface-2);border:1px solid var(--cyan);color:var(--cyan);padding:0 16px;border-radius:6px;cursor:pointer;font-weight:600}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:.85em;margin-bottom:6px}.field input,.promo-box input{padding:11px 12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;font-family:inherit}.field input{width:100%}.pay-note{color:var(--muted);font-size:.85em;line-height:1.55;margin:12px 0 16px}.pay-note b{color:var(--cyan)}.msg{color:var(--muted);font-size:.86em;margin-top:10px}.empty{text-align:center;padding:80px 10px;color:var(--muted)}.empty .hvb-spin{margin:auto}@media(max-width:600px){.buy{align-items:stretch;flex-direction:column}.btn{width:100%}.detail-grid{grid-template-columns:1fr}}</style>
<style id="hvb-page-transition-style">.hvb-page-transition{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(7,17,30,.88);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .18s}.hvb-page-transition.show{opacity:1;visibility:visible}.hvb-page-transition i{width:44px;height:44px;border:3px solid rgba(180,240,240,.22);border-top-color:#3FC7F2;border-right-color:#7C6BF5;border-radius:50%;animation:hvb-page-spin .72s linear infinite}@keyframes hvb-page-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.hvb-page-transition i{animation-duration:1.5s}}</style>
<script src="/hvb-page-loader.js" defer></script>
<script src="/hvb-site-settings.js" defer></script>
</head>
<body><script src="hvb-ref.js"></script><script src="/hvb-track.js?v=20260916-2"></script>
<header><a class="brand" href="/"><img src="hvb-logo.png" alt="HVB"><b>HVB</b></a><a class="back" href="/courses">← সব কোর্স</a></header>
<main id="main"><div class="empty"><div class="hvb-spin" aria-label="লোড হচ্ছে"></div></div></main>
<div class="overlay" id="payModal"><div class="modal"><button class="close" onclick="closePay()">✕</button><h3 id="modalTitle">কোর্স</h3><div class="price-tag" id="modalPrice"></div><div class="promo-box"><input id="promo" placeholder="প্রোমো কোড থাকলে দিন"><button type="button" class="promo-btn" onclick="applyPromo()">Apply</button></div><div id="promoMsg" class="msg"></div><p class="pay-note">নাম ও যোগাযোগ দিয়ে এগিয়ে যান—পরের পেজে bKash/Nagad/Rocket দিয়ে নিরাপদে পেমেন্ট করবেন। <b>পেমেন্ট সফল হলেই কোর্স পেয়ে যাবেন।</b></p><form onsubmit="return pay(event)"><div class="field"><label>আপনার নাম</label><input id="name" required placeholder="পূর্ণ নাম লিখুন"></div><div class="field"><label>ফোন নাম্বার / ইমেইল</label><input id="contact" required placeholder="যোগাযোগের নাম্বার/ইমেইল"></div><button class="btn hvb-wide" id="payBtn" type="submit">এগিয়ে যান পেমেন্টে →</button><div id="msg" class="msg"></div></form></div></div>
<script>
var product=null,slug=(new URLSearchParams(location.search).get('course')||'').toLowerCase();
function esc(v){var d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML}function money(v){return Number(v||0).toLocaleString('bn-BD')+' ৳'}
function hvbImg(u){u=String(u||'');var m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=|thumbnail\?id=)([-\w]{20,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200':u};fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'products_get'})}).then(function(r){return r.json()}).then(function(d){product=(d.products||[]).find(function(x){return x.slug===slug});if(!product)throw Error();document.title=product.title+' | HVB';var old=product.regular_price>product.price?'<span class="old">'+money(product.regular_price)+'</span>':'';var extra=product.slug==='ai-kids-comedy'?'<section class="detail-section"><h2>এই কোর্সে যা শিখবেন</h2><div class="detail-grid"><div class="detail-item">AI Kids Comedy ভিডিওর আইডিয়া ও গল্প তৈরি</div><div class="detail-item">রেডি Master Chatting Prompt ব্যবহার</div><div class="detail-item">Baby Boy ও Baby Girl চরিত্র ঠিক রাখা</div><div class="detail-item">Google Flow-এর জন্য ১০ সেকেন্ডের 9:16 ক্লিপ</div><div class="detail-item">আকর্ষণীয় Title ও Hashtags লেখা</div><div class="detail-item">Professional Thumbnail তৈরি</div><div class="detail-item">দ্রুত Editing ও ভিডিও প্রস্তুত</div><div class="detail-item">ভিডিও Upload করার সম্পূর্ণ নিয়ম</div></div></section><section class="detail-section"><h2>কার জন্য এই কোর্স</h2><div class="description">একদম নতুন, নিজের ভিডিও আইডিয়া নেই, অথবা কম সময়ে নিয়মিত AI Kids Comedy কনটেন্ট বানাতে চান—সবার জন্য সহজ বাংলায় ধাপে ধাপে দেখানো হয়েছে।</div><div class="support-note">কোর্স চলাকালে কোনো সমস্যায় পড়লে Messenger-এ সম্পূর্ণ সহায়তা পাবেন।</div></section>':'';document.getElementById('main').innerHTML='<div class="eyebrow">HVB PREMIUM COURSE</div><h1>'+esc(product.title)+'</h1>'+(product.thumbnail?'<img class="cover" src="'+esc(hvbImg(product.thumbnail))+'" alt="'+esc(product.title)+'">':'')+'<div class="description">'+esc(product.description||product.short_description||'সম্পূর্ণ বাংলায় ধাপে ধাপে শেখানো হবে।')+'</div>'+extra+'<div class="buy"><div>'+old+'<span class="price">'+money(product.price)+'</span></div><button class="btn" onclick="openPay()">কিনুন</button></div>';if(location.hash==='#buy')openPay()}).catch(function(){document.getElementById('main').innerHTML='<div class="empty">কোর্সটি এখন পাওয়া যাচ্ছে না।<br><a href="/courses" style="color:var(--cyan)">সব কোর্স দেখুন</a></div>'});
function openPay(){if(!product)return;var run=function(){document.getElementById('modalTitle').textContent=product.title;document.getElementById('modalPrice').textContent=money(product.price);document.getElementById('payModal').classList.add('on')};if(window.HVBAuth)window.HVBAuth.gate(run);else run()}function closePay(){document.getElementById('payModal').classList.remove('on')}
async function applyPromo(){var code=document.getElementById('promo').value.trim().toUpperCase(),m=document.getElementById('promoMsg'),b=document.querySelector('.promo-btn');if(!code){m.textContent='প্রোমো কোড লিখুন।';return}m.textContent='';b.classList.add('hvb-busy');b.disabled=true;try{var r=await fetch('/api/create-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'checkPromo',promoCode:code})});var d=await r.json();m.textContent=d&&d.valid?'প্রোমো কোড প্রয়োগ হয়েছে।':'প্রোমো কোডটি সঠিক নয়।'}catch(x){m.textContent='এখন যাচাই করা যাচ্ছে না।'}b.classList.remove('hvb-busy');b.disabled=false}
async function pay(e){e.preventDefault();var b=document.getElementById('payBtn'),m=document.getElementById('msg');b.classList.add('hvb-busy');b.disabled=true;m.textContent='';try{var r=await fetch('/api/create-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:slug,name:document.getElementById('name').value.trim(),contact:document.getElementById('contact').value.trim(),promoCode:document.getElementById('promo').value.trim(),ref:window.hvbGetRef?window.hvbGetRef():'',returnUrl:location.origin+location.pathname+location.search})});var d=await r.json();if(!r.ok||!d.payment_url)throw Error(d.error||'পেমেন্ট শুরু করা যাচ্ছে না। Messenger-এ জানান।');location.href=d.payment_url}catch(x){m.textContent=x.message||'সমস্যা হয়েছে। Messenger-এ যোগাযোগ করুন।';b.classList.remove('hvb-busy');b.disabled=false}return false}
</script><script src="hvb-account.js"></script></body></html>
