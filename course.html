<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HVB Course | AI Video Learning</title><meta name="description" content="HVB-এর প্রফেশনাল বাংলা AI ভিডিও কোর্সের বিস্তারিত, মূল্য ও নিরাপদ অনলাইন enrollment।">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hvb-theme.css"><link rel="stylesheet" href="hvb-ui.css"><link rel="stylesheet" href="hvb-ui-extra.css">
<style>:root{--bg:#05070D;--surface:#0F1421;--surface-2:#161D2E;--line:#212A42;--text:#F2F6FF;--muted:#9AA5BF;--cyan:#3FC7F2;--violet:#7C6BF5;--grad:linear-gradient(103deg,#B4F0F0,#3FC7F2 45%,#7C6BF5)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',sans-serif}a{text-decoration:none;color:inherit}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:rgba(5,7,13,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{display:flex;gap:10px;align-items:center}.brand img{width:38px;height:38px;border-radius:8px}.brand b{font-family:Sora}.back{color:var(--muted)}main{max-width:920px;margin:auto;padding:38px 20px 100px}.eyebrow{color:var(--cyan);font-size:.78em;text-transform:uppercase}h1{font:800 clamp(1.7em,5vw,2.8em)/1.25 Sora;margin:8px 0 18px}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}.description{color:var(--muted);font-size:1.05em;white-space:pre-wrap;margin:24px 0}.buy{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.price{font:800 1.7em Sora;color:var(--cyan)}.old{text-decoration:line-through;color:var(--muted);margin-right:8px}.btn{border:0;border-radius:7px;padding:12px 22px;background:var(--grad);color:#04121F;font-weight:800;cursor:pointer}.overlay{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:18px}.overlay.on{display:flex}.modal{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:8px;position:relative}.close{position:absolute;right:12px;top:10px;border:0;background:none;color:var(--muted);font-size:1.2em}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:.84em;margin-bottom:5px}.field input{width:100%;padding:11px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px}.msg{color:var(--muted);font-size:.86em;margin-top:10px}.empty{text-align:center;padding:80px 10px;color:var(--muted)}@media(max-width:600px){.buy{align-items:stretch;flex-direction:column}.btn{width:100%}}</style></head>
<body><script src="hvb-ref.js"></script><script src="hvb-track.js"></script>
<header><a class="brand" href="/"><img src="hvb-logo.png" alt="HVB"><b>HVB</b></a><a class="back" href="/courses">← All Courses</a></header>
<main id="main"><div class="empty"><span class="hvb-inline-spin"></span></div></main>
<div class="overlay" id="payModal"><div class="modal"><button class="close" onclick="closePay()">✕</button><h2 id="modalTitle">Enroll</h2><div class="price" id="modalPrice"></div><form onsubmit="return pay(event)"><div class="field"><label>আপনার নাম</label><input id="name" required></div><div class="field"><label>Phone / Email</label><input id="contact" required></div><div class="field"><label>Promo Code (optional)</label><input id="promo"></div><button class="btn" id="payBtn" type="submit">Continue to Payment</button><div id="msg" class="msg"></div></form></div></div>
<script>
var product=null,slug=(new URLSearchParams(location.search).get('course')||'').toLowerCase();
function esc(v){var d=document.createElement('div');d.textContent=String(v||'');return d.innerHTML}function money(v){return Number(v||0).toLocaleString('bn-BD')+' ৳'}
fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'products_get'})}).then(function(r){return r.json()}).then(function(d){product=(d.products||[]).find(function(x){return x.slug===slug});if(!product)throw Error();document.title=product.title+' | HVB';var old=product.regular_price>product.price?'<span class="old">'+money(product.regular_price)+'</span>':'';document.getElementById('main').innerHTML='<div class="eyebrow">HVB PREMIUM COURSE</div><h1>'+esc(product.title)+'</h1>'+(product.thumbnail?'<img class="cover" src="'+esc(product.thumbnail)+'" alt="'+esc(product.title)+'">':'')+'<div class="description">'+esc(product.description||product.short_description||'সম্পূর্ণ বাংলায় ধাপে ধাপে শেখানো হবে।')+'</div><div class="buy"><div>'+old+'<span class="price">'+money(product.price)+'</span></div><button class="btn" onclick="openPay()">Enroll Now</button></div>';if(location.hash==='#buy')openPay()}).catch(function(){document.getElementById('main').innerHTML='<div class="empty">কোর্সটি এখন পাওয়া যাচ্ছে না।<br><a href="/courses" style="color:var(--cyan)">All Courses দেখুন</a></div>'});
function openPay(){if(!product)return;var run=function(){document.getElementById('modalTitle').textContent=product.title;document.getElementById('modalPrice').textContent=money(product.price);document.getElementById('payModal').classList.add('on')};if(window.HVBAuth)window.HVBAuth.gate(run);else run()}function closePay(){document.getElementById('payModal').classList.remove('on')}
async function pay(e){e.preventDefault();var b=document.getElementById('payBtn'),m=document.getElementById('msg');b.classList.add('hvb-busy');b.disabled=true;m.textContent='';try{var r=await fetch('/api/create-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:slug,name:document.getElementById('name').value.trim(),contact:document.getElementById('contact').value.trim(),promoCode:document.getElementById('promo').value.trim(),ref:window.hvbGetRef?window.hvbGetRef():'',returnUrl:location.origin+location.pathname+location.search})});var d=await r.json();if(!r.ok||!d.payment_url)throw Error(d.error||'Payment error');location.href=d.payment_url}catch(x){m.textContent=x.message||'সমস্যা হয়েছে। Messenger-এ যোগাযোগ করুন।';b.classList.remove('hvb-busy');b.disabled=false}return false}
</script><script src="hvb-account.js"></script></body></html>
