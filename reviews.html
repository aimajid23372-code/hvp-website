<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="icon" href="/hvb-logo.png" type="image/png" />
  <title>শিক্ষার্থীদের রিভিউ | Hyper Vision Bangla</title>
  <style>
    body { background:#05070E; color:#F8FAFC; font-family:'Noto Sans Bengali','Plus Jakarta Sans',sans-serif; }
    .lux-card { background:linear-gradient(180deg,rgba(17,24,39,.78),rgba(11,15,26,.95)); border:1px solid rgba(255,255,255,.08); }
  </style>
</head>
<body class="min-h-screen">
<header class="sticky top-0 z-40 bg-[#05070E]/85 backdrop-blur-xl border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2.5">
      <img src="/hvb-logo.png" class="w-9 h-9 rounded-full object-cover ring-2 ring-cyan-400/40" alt="HVB" onerror="this.style.display='none'" />
      <span class="font-bold text-white text-base">Hyper Vision Bangla</span>
    </a>
    <a href="/" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-semibold text-cyan-300 hover:bg-white/10">← হোমপেজ</a>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10 space-y-8">
  <div class="lux-card rounded-3xl p-8 text-center border border-cyan-400/20">
    <h1 class="text-3xl sm:text-4xl font-bold text-white">শিক্ষার্থীদের বাস্তব অভিজ্ঞতা</h1>
    <p class="text-sm text-slate-400 mt-2">প্রতিটি রিভিউ পেমেন্ট-যাচাই করা অ্যাকাউন্ট থেকে দেওয়া। শিক্ষার্থীরা চাইলে স্ক্রিনশট ও নিজের বানানো ভিডিওর লিংকও যোগ করতে পারেন।</p>
    <div id="rev-summary" class="mt-4 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-400/15 border border-amber-400/30 text-amber-300 text-xs font-bold">লোড হচ্ছে...</div>
  </div>

  <div id="reviews-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<footer class="border-t border-white/10 mt-16 py-8 text-center text-xs text-slate-400">
  © ২০২৬ Hyper Vision Bangla (HVB) · <a href="/" class="text-cyan-300 hover:underline">হোমপেজ</a> · <a href="https://m.me/hypervisionbangla" target="_blank" class="text-sky-300 hover:underline">Messenger সাপোর্ট</a>
</footer>

<script>
(async function () {
  const grid = document.getElementById('reviews-grid');
  const sum = document.getElementById('rev-summary');
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  try {
    const res = await fetch('/api/my-access?reviews=all', { cache: 'no-store' });
    const data = await res.json();
    const items = (data && Array.isArray(data.items)) ? data.items : [];
    if (!items.length) {
      sum.textContent = '★ 5.0 · এখনো কোনো অ্যাপ্রুভড রিভিউ নেই';
      grid.innerHTML = '<div class="col-span-full text-center text-sm text-slate-400 py-10">কোনো রিভিউ পাওয়া যায়নি।</div>';
      return;
    }
    sum.textContent = '★ ' + Number(data.avg || 5).toFixed(1) + ' (' + items.length + 'টি যাচাইকৃত রিভিউ)';
    grid.innerHTML = items.map(r => {
      const stars = '★'.repeat(Math.min(5, Math.max(1, Number(r.rating) || 5)));
      const dateStr = r.created_at ? new Date(r.created_at).toLocaleDateString('bn-BD') : '';
      return '<article class="lux-card rounded-2xl p-5 flex flex-col justify-between gap-4">' +
        '<div class="space-y-3">' +
          '<div class="flex items-center justify-between">' +
            '<span class="text-amber-400 text-sm tracking-wider">' + stars + '</span>' +
            '<span class="px-2.5 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 text-[11px] font-semibold">' + esc(r.course || 'HVB') + '</span>' +
          '</div>' +
          '<p class="text-sm text-slate-200 leading-relaxed whitespace-pre-line">' + esc(r.body) + '</p>' +
          (r.image_url ? '<a href="' + esc(r.image_url) + '" target="_blank" rel="noopener" class="block rounded-xl overflow-hidden border border-white/10 bg-black/40"><img src="' + esc(r.image_url) + '" alt="Student Review Screenshot" class="w-full max-h-60 object-cover hover:scale-105 transition" loading="lazy" /></a>' : '') +
          (r.link ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 text-xs font-semibold hover:bg-cyan-500/25">▶ শিক্ষার্থীর বানানো ভিডিও দেখুন ↗</a>' : '') +
        '</div>' +
        '<div class="pt-3 border-t border-white/10 flex items-center justify-between text-xs">' +
          '<span class="font-bold text-white">' + esc(r.name || 'HVB শিক্ষার্থী') + '</span>' +
          '<span class="text-slate-500">' + esc(dateStr) + '</span>' +
        '</div>' +
      '</article>';
    }).join('');
  } catch (err) {
    sum.textContent = 'রিভিউ লোড করতে সমস্যা হয়েছে';
  }
})();
</script>
</body>
</html>
