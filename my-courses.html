<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>আমার কোর্স | HVB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090C13; --surface:#131826; --surface-2:#1A2133; --line:#242C42;
    --text:#EAF0FF; --muted:#8891A8; --cyan:#5EEAD4; --violet:#A78BFA;
    --grad: linear-gradient(90deg, var(--cyan), var(--violet));
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, rgba(94,234,212,0.06), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(167,139,250,0.08), transparent 40%),
                var(--bg);
    color:var(--text); font-family:'Hind Siliguri', sans-serif; line-height:1.65;
  }
  a{ color:inherit; text-decoration:none; }
  header{
    position:sticky; top:0; z-index:20; background:rgba(9,12,19,0.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:34px; height:34px; border-radius:8px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; }
  .brand-text b{ font-family:'Sora',sans-serif; font-size:1.02em; }
  .brand-text span{ font-size:0.65em; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; }
  .back-link{ color:var(--muted); font-size:0.9em; }
  .wrap{ max-width:700px; margin:0 auto; padding:44px 24px 90px; }
  h1{ font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(1.5em,5vw,2em); margin-bottom:12px; }
  p.lead{ color:var(--muted); margin-bottom:24px; }
  .lookup-box{ display:flex; gap:8px; margin-bottom:10px; }
  .lookup-input{ flex:1; padding:13px 14px; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:1em; font-family:'Hind Siliguri'; }
  .lookup-input:focus{ outline:none; border-color:var(--cyan); }
  .lookup-btn{ background:var(--grad); color:#0A0D14; border:none; padding:0 22px; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.95em; }
  .lookup-msg{ font-size:0.88em; margin-bottom:20px; min-height:1.2em; }
  .lookup-msg.error{ color:#F87171; }
  .lookup-msg.info{ color:var(--muted); }
  .deliver-link{ display:inline-block; background:var(--grad); color:#0A0D14; font-weight:700; padding:9px 18px; border-radius:6px; font-size:0.88em; margin-right:8px; }
  .course-section{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px; }
  .hvb-auth-box{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .hvb-auth-head b{ display:block; font-family:'Sora',sans-serif; font-size:1.05em; margin-bottom:4px; }
  .hvb-auth-head span{ display:block; color:var(--muted); font-size:0.85em; margin-bottom:14px; }
  .hvb-google-btn{ display:inline-flex; align-items:center; gap:10px; cursor:pointer; background:#fff; color:#1f2328; border:none; border-radius:10px; padding:11px 18px; font-weight:700; font-size:0.95em; font-family:inherit; }
  .hvb-auth-state{ margin-top:12px; font-size:0.87em; color:var(--muted); }
  .hvb-auth-state b{ color:var(--cyan); }
  .hvb-auth-state button{ background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:5px 10px; font-size:0.85em; cursor:pointer; margin-left:8px; }
  .hvb-or{ text-align:center; margin:0 0 14px; color:var(--muted); font-size:0.8em; }
  .hvb-course{ padding:0; overflow:hidden; border-radius:18px; background:linear-gradient(180deg,rgba(63,199,242,.06),rgba(124,107,245,.03)); border:1px solid rgba(63,199,242,.22); }
  .hvb-course-head{ padding:20px 22px 14px; border-bottom:1px solid var(--line); }
  .hvb-course-head h3{ margin:8px 0 0; font-size:1.25em; }
  .hvb-badge{ display:inline-block; font-size:.75em; font-weight:700; padding:4px 10px; border-radius:99px; background:rgba(180,240,240,.12); color:#B4F0F0; border:1px solid rgba(180,240,240,.3); }
  .hvb-how{ padding:16px 22px; }
  .hvb-steps{ list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px; }
  .hvb-steps li{ display:flex; gap:10px; align-items:flex-start; font-size:.9em; color:var(--muted); }
  .hvb-steps li b{ color:var(--text); }
  .hvb-steps i{ flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:.8em; background:linear-gradient(135deg,#B4F0F0,#3FC7F2,#7C6BF5); color:#0A0D14; }
  .hvb-prompt,.hvb-watch,.hvb-note{ margin:0 22px 16px; border-radius:14px; border:1px solid var(--line); background:rgba(10,13,20,.45); }
  .hvb-prompt{ padding:14px; }
  .hvb-prompt-head,.hvb-watch{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .hvb-tag{ display:inline-block; font-size:.7em; font-weight:700; color:#3FC7F2; margin-bottom:3px; }
  .hvb-copy,.hvb-watch-btn{ background:linear-gradient(135deg,#B4F0F0,#3FC7F2,#7C6BF5); color:#0A0D14; border:none; font-weight:800; padding:11px 20px; border-radius:12px; cursor:pointer; font-size:.92em; text-decoration:none; white-space:nowrap; }
  .hvb-pre{ margin:12px 0 0; max-height:120px; overflow:hidden; font-family:'JetBrains Mono',monospace; font-size:.74em; color:var(--muted); white-space:pre-wrap; word-break:break-word; padding:12px; border-radius:10px; background:rgba(0,0,0,.25); }
  .hvb-pre.open{ max-height:420px; overflow-y:auto; }
  .hvb-more{ margin-top:8px; background:none; border:none; color:#3FC7F2; font-weight:600; cursor:pointer; font-size:.85em; }
  .hvb-watch{ padding:14px; }
  .hvb-note{ padding:12px 14px; font-size:.87em; color:var(--muted); }
  @media (max-width:600px){ .wrap{ padding:30px 16px 70px; } .lookup-box{ flex-direction:column; } .hvb-copy,.hvb-watch-btn{ width:100%; text-align:center; } }
</style>
<link rel="icon" href="/hvb-logo.png" type="image/png">
</head>
<body>
<header>
  <a href="/" class="brand">
    <img src="hvb-logo.png" alt="HVB Logo">
    <div class="brand-text"><b>HVB</b><span>Hyper Vision Bangla</span></div>
  </a>
  <a href="/" class="back-link">← Home</a>
</header>

<div class="wrap">
  <h1>আমার কোর্স দেখুন</h1>
  <p class="lead">পেমেন্টের সময় যে ফোন নাম্বার বা ইমেইল দিয়েছিলেন সেটা দিন — আপনার কোর্স ভিডিও ও মাস্টার প্রম্পট সাথে সাথেই খুলে যাবে।</p>

  <div class="hvb-auth-box">
    <div class="hvb-auth-head">
      <b>এক ক্লিকে লগইন</b>
      <span>Google দিয়ে লগইন করলে পরে আর কিছু লেখা লাগবে না — কোর্স নিজেই খুলে যাবে।</span>
    </div>
    <button type="button" id="gBtn" class="hvb-google-btn" onclick="hvbGoogleLogin()">
      <img src="https://www.google.com/favicon.ico" alt="" width="18" height="18"> Google দিয়ে লগইন
    </button>
    <div id="hvbAuthState" class="hvb-auth-state"></div>
  </div>

  <div class="hvb-or"><span>অথবা</span></div>

  <div class="lookup-box">
    <input type="text" id="contactInput" class="lookup-input" placeholder="নাম্বার / ইমেইল / Order ID">
    <button type="button" class="lookup-btn" onclick="lookupOrder()">খুঁজুন</button>
  </div>
  <div id="lookupMsg" class="lookup-msg"></div>
  <div id="resultsArea"></div>
</div>

<script>
  function copyPrompt(elId, btn){
    const text = document.getElementById(elId).innerText;
    navigator.clipboard.writeText(text).then(function(){
      const old = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(function(){ btn.textContent = old; }, 2000);
    });
  }
  function togglePrompt(id, btn){
    var el=document.getElementById(id); if(!el) return;
    var open=el.classList.toggle('open');
    btn.textContent = open ? 'ছোট করুন ↑' : 'পুরোটা দেখুন ↓';
  }
  function renderCourseBlock(idx, type, title, contentObj) {
    if(!contentObj) return '';
    var pr = String(contentObj.prompt || '').trim();
    var prLink = String(contentObj.prompt_link || '').trim();
    var esc = function(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    var pid = 'promptText' + idx;

    var linkHtml = contentObj.link
      ? '<div class="hvb-watch"><div><span class="hvb-tag">ধাপ ১</span><b>কোর্স ভিডিও দেখুন</b><small>প্রথমে পুরো ভিডিওটি মনোযোগ দিয়ে দেখুন</small></div>' +
        '<a href="' + contentObj.link + '" target="_blank" rel="noopener" class="hvb-watch-btn">ভিডিও দেখুন →</a></div>'
      : '';

    var promptLinkHtml = prLink
      ? '<div class="hvb-watch" style="border-color:rgba(0,229,255,0.35);"><div><span class="hvb-tag">ধাপ ২</span><b>Master Chatting Prompt (Google Drive)</b><small>ভিডিও দেখে এই ফোল্ডার থেকে মাস্টার প্রম্পট ব্যবহার করুন</small></div>' +
        '<a href="' + prLink + '" target="_blank" rel="noopener" class="hvb-watch-btn">মাস্টার প্রম্পট খুলুন →</a></div>'
      : '';

    var promptHtml = pr
      ? '<div class="hvb-prompt">' +
          '<div class="hvb-prompt-head"><div><span class="hvb-tag">ধাপ ২</span><b>Master Chatting Prompt</b><small>' + pr.length.toLocaleString('bn-BD') + ' অক্ষর · পুরোটা একবারে কপি হবে</small></div>' +
          '<button type="button" class="hvb-copy" onclick="copyPrompt(\'' + pid + '\', this)">Copy Prompt</button></div>' +
          '<pre id="' + pid + '" class="hvb-pre">' + esc(pr) + '</pre>' +
          '<button type="button" class="hvb-more" onclick="togglePrompt(\'' + pid + '\', this)">পুরোটা দেখুন ↓</button>' +
        '</div>'
      : '';

    var freeSubHtml = contentObj.free_subscription
      ? '<div class="hvb-watch" style="background:rgba(37,211,102,0.1); border-color:#25D366;">' +
          '<div><span class="hvb-tag" style="color:#4ADE80;">🎁 ফ্রি সাবস্ক্রিপশন (শুধু 2D Animation কোর্সের জন্য)</span>' +
          '<b>ফ্রি সাবস্ক্রিপশন সংগ্রহ করুন</b><small>WhatsApp (01948520271)-এ মেসেজ দিয়ে আপনার ফ্রি সাবস্ক্রিপশন বুঝে নিন</small></div>' +
          '<a href="https://wa.me/8801948520271?text=' + encodeURIComponent('আসসালামু আলাইকুম, আমি 2D Animation কোর্সটি কিনেছি। আমার ফ্রি সাবস্ক্রিপশনটি নিতে চাই।') + '" target="_blank" rel="noopener" class="hvb-watch-btn" style="background:#25D366; color:#042410;">ফ্রি সাবস্ক্রিপশন নিন →</a>' +
        '</div>'
      : '';

    return '<div class="course-section hvb-course">' +
      '<div class="hvb-course-head"><span class="hvb-badge">✓ কেনা হয়েছে</span><h3>' + esc(String(title)) + '</h3></div>' +
      '<div style="padding-top:16px;">' + linkHtml + promptLinkHtml + promptHtml + freeSubHtml + '</div>' +
    '</div>';
  }

  function renderCourses(courses, contentData){
    const results = document.getElementById('resultsArea');
    let html = '', idx = 0;
    contentData = contentData || {};
    const rawList = Array.isArray(courses) ? courses : [courses];
    let renderShort = false, renderLong = false;

    rawList.forEach(function(c) {
      const s = String(c || '').toLowerCase().trim();
      if ((s.includes('short') && s.includes('long')) || s.includes('bundle') || s.includes('combo') || s.includes('both')) {
        renderShort = true; renderLong = true;
      } else if (s.includes('short')) renderShort = true;
      else if (s.includes('long')) renderLong = true;
    });

    if (renderShort && contentData['short']) html += renderCourseBlock(idx++, 'short', 'Short Video Course', contentData['short']);
    if (renderLong && contentData['long']) html += renderCourseBlock(idx++, 'long', 'Long Video Course', contentData['long']);
    rawList.forEach(function(c) {
      const slug = String(c || '').toLowerCase().trim();
      if (!['short','long','bundle'].includes(slug) && contentData[slug]) {
        html += renderCourseBlock(idx++, slug, contentData[slug].title || slug, contentData[slug]);
      }
    });

    html += '<div class="course-section" style="background: rgba(37,211,102,0.07); border-color:#25D366;">' +
      '<h3>📱 WhatsApp ফুল সাপোর্ট (শুধু ক্রেতাদের জন্য)</h3>' +
      '<p style="color:var(--text); font-size:0.9em; margin: 8px 0;">যেকোনো সমস্যায় সরাসরি WhatsApp-এ মেসেজ দিন। নম্বর: <b>01948520271</b></p>' +
      '<a href="https://wa.me/8801948520271" target="_blank" rel="noopener" class="deliver-link" style="background:#25D366; color:#062b13;">WhatsApp-এ মেসেজ দিন →</a>' +
    '</div>';

    results.innerHTML = html;
  }

  async function lookupOrder(){
    const contact = document.getElementById('contactInput').value.trim();
    const msg = document.getElementById('lookupMsg');
    const results = document.getElementById('resultsArea');
    results.innerHTML = '';
    if(!contact){ msg.textContent = 'ফোন নাম্বার, ইমেইল বা Order ID দিন'; msg.className = 'lookup-msg error'; return; }
    try { localStorage.setItem('hvb_contact', contact); } catch(e){}
    msg.textContent = 'খোঁজা হচ্ছে...'; msg.className = 'lookup-msg info';

    try {
      const res = await fetch('/api/lookup-order', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contact })
      });
      const data = await res.json();
      const courses = data.courses || [];
      if(courses.length === 0){
        msg.innerHTML = 'কোনো সফল পেমেন্ট পাওয়া যায়নি। সমস্যা হলে <a href="https://wa.me/8801948520271" target="_blank" style="color:#25D366">WhatsApp (01948520271)</a>-এ জানান।';
        msg.className = 'lookup-msg error'; return;
      }
      msg.textContent = '✅ আপনার কোর্স পাওয়া গেছে!'; msg.className = 'lookup-msg';
      renderCourses(courses, data.content);
    } catch(err){ msg.textContent = 'সমস্যা হয়েছে, আবার চেষ্টা করুন।'; msg.className = 'lookup-msg error'; }
  }

  async function checkPaidOrder(orderRef, attempt){
    attempt = attempt || 0;
    const msg = document.getElementById('lookupMsg');
    try {
      const res = await fetch('/api/order-status?ref=' + encodeURIComponent(orderRef));
      const data = await res.json();
      if(data.status === 'paid'){
        msg.innerHTML = '✅ <b>পেমেন্ট সফল হয়েছে!</b> আপনার কোর্স নিচে খুলে দেওয়া হয়েছে।';
        msg.className = 'lookup-msg';
        if(data.contact){ try { localStorage.setItem('hvb_contact', data.contact); } catch(e){} }
        renderCourses(data.courses && data.courses.length ? data.courses : [data.course], data.content);
        return;
      }
    } catch(err){}
    if(attempt < 24) setTimeout(function(){ checkPaidOrder(orderRef, attempt + 1); }, 2500);
  }

  window.addEventListener('DOMContentLoaded', function(){
    const params = new URLSearchParams(window.location.search);
    const orderRef = params.get('order');
    const saved = localStorage.getItem('hvb_contact');
    if(saved){ const input = document.getElementById('contactInput'); if(input) input.value = saved; }
    if(orderRef){
      document.getElementById('lookupMsg').textContent = 'পেমেন্ট ভেরিফাই হচ্ছে...';
      history.replaceState({}, '', window.location.pathname);
      checkPaidOrder(orderRef, 0);
    } else if(saved){ lookupOrder(); }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var hvbSb = null;
  async function hvbInitAuth(){
    try {
      const cfg = await (await fetch('/api/my-access?config=1')).json();
      if(!cfg.enabled || !window.supabase) return;
      hvbSb = window.supabase.createClient(cfg.url, cfg.anonKey);
      const { data } = await hvbSb.auth.getSession();
      if(data && data.session) hvbAfterLogin(data.session);
    } catch(e){}
  }
  async function hvbGoogleLogin(){
    if(!hvbSb) await hvbInitAuth();
    if(!hvbSb) return;
    await hvbSb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/my-courses' } });
  }
  async function hvbLogout(){ if(hvbSb) await hvbSb.auth.signOut(); location.reload(); }
  async function hvbAfterLogin(session){
    const state = document.getElementById('hvbAuthState');
    const btn = document.getElementById('gBtn'); if(btn) btn.style.display = 'none';
    const res = await fetch('/api/my-access', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ access_token: session.access_token }) });
    const data = await res.json();
    if((data.courses || []).length){
      state.innerHTML = '<b>' + data.email + '</b> — আপনার কোর্স নিচে খুলে দেওয়া হয়েছে। <button type="button" onclick="hvbLogout()">লগআউট</button>';
      renderCourses(data.courses, data.content);
    } else {
      state.innerHTML = '<b>' + (data.email||'') + '</b> — এই ইমেইলে কোনো কোর্স পাওয়া যায়নি। <button type="button" onclick="hvbLogout()">লগআউট</button>';
    }
  }
  window.addEventListener('DOMContentLoaded', hvbInitAuth);
</script>
</body>
</html>
